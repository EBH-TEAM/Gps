<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS Tracker</title>
<style>
body{
    background:#111;color:#fff;font-family:Arial;
    text-align:center;padding:40px 10px;
}
h3{color:#aaa;margin-bottom:5px}
#speed,#distance{font-size:45px;font-weight:bold;margin:10px}
button{padding:12px 25px;font-size:18px}
</style>
</head>

<body>

<h3>স্পিড</h3>
<div id="speed">0.0 km/h</div>

<h3>দূরত্ব</h3>
<div id="distance">0.00 km</div>

<button onclick="toggle()" id="btn">▶ শুরু</button>

<script>
let watch = null;
let running = false;

let lastLat = null;
let lastLon = null;
let lastTime = null;

let total = 0;
let currentSpeed = 0;

const speedEl = document.getElementById("speed");
const distanceEl = document.getElementById("distance");
const btn = document.getElementById("btn");

function calcDistance(lat1,lon1,lat2,lon2){

    const R = 6371000;
    const p = Math.PI/180;

    const a =
        Math.sin((lat2-lat1)*p/2)**2 +
        Math.cos(lat1*p) *
        Math.cos(lat2*p) *
        Math.sin((lon2-lon1)*p/2)**2;

    return R * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );
}

function gps(position){

    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    const gpsSpeed = position.coords.speed;
    const accuracy = position.coords.accuracy;
    const time = position.timestamp;

    if(lastLat === null){

        lastLat = lat;
        lastLon = lon;
        lastTime = time;

        currentSpeed = 0;
        show();
        return;
    }

    const meters = calcDistance(
        lastLat,lastLon,lat,lon
    );

    const seconds = (time-lastTime)/1000;

    if(seconds <= 0) return;

    // GPS speed পাওয়া গেলে সেটি ব্যবহার
    let calculatedSpeed;

    if(gpsSpeed !== null && gpsSpeed >= 0){
        calculatedSpeed = gpsSpeed * 3.6;
    }else{
        calculatedSpeed = (meters/seconds)*3.6;
    }

    /*
      GPS jitter বাদ দেওয়া।
      3 মিটারের কম movement হলে
      distance যোগ হবে না।
    */
    if(meters >= 3){

        total += meters/1000;

        lastLat = lat;
        lastLon = lon;
        lastTime = time;
    }

    /*
      GPS speed না থাকলে movement থেকে speed।
      হাঁটার সময় 0 না দেখানোর জন্য
      calculated speed ব্যবহার করা হচ্ছে।
    */
    if(calculatedSpeed >= 0.5){

        currentSpeed = calculatedSpeed;

    }else if(meters >= 3){

        currentSpeed = (meters/seconds)*3.6;

    }else{

        currentSpeed = 0;
    }

    // অস্বাভাবিক GPS jump বাদ
    if(currentSpeed > 200){
        currentSpeed = 0;
    }

    show();
}

function show(){

    speedEl.textContent =
        currentSpeed.toFixed(1)+" km/h";

    distanceEl.textContent =
        total.toFixed(2)+" km";
}

function error(){

    currentSpeed = 0;
    show();
}

function start(){

    if(!navigator.geolocation){
        alert("GPS সাপোর্ট নেই");
        return;
    }

    watch = navigator.geolocation.watchPosition(
        gps,
        error,
        {
            enableHighAccuracy:true,
            maximumAge:0,
            timeout:15000
        }
    );

    running = true;
    btn.textContent="⏹ বন্ধ";
}

function stop(){

    if(watch !== null){
        navigator.geolocation.clearWatch(watch);
        watch=null;
    }

    running=false;
    currentSpeed=0;

    show();

    btn.textContent="▶ শুরু";
}

function toggle(){

    if(running){
        stop();
    }else{
        start();
    }
}

show();
</script>

</body>
</html>
