<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>স্পিড ট্র্যাকার প্রো</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #070b12;
            padding: 10px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255,0,102,0.05), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(0,102,255,0.05), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255,204,0,0.03), transparent 60%);
            animation: bgMove 15s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgMove {
            0% { transform: scale(1) rotate(0deg); }
            33% { transform: scale(1.1) rotate(120deg); }
            66% { transform: scale(0.9) rotate(240deg); }
            100% { transform: scale(1.05) rotate(360deg); }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 400px;
            min-height: 95vh;
            min-height: 95dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px 10px;
            position: relative;
            z-index: 1;
            gap: 12px;
            justify-content: space-between;
        }

        .circle-card {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.3s ease;
        }

        .circle-card .inner-bg {
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border-radius: 50%;
            z-index: 0;
        }

        .circle-card .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .speed-card {
            background: radial-gradient(circle at 30% 30%, #141e33, #080e1a);
        }

        .speed-card .inner-bg {
            background: radial-gradient(circle at 30% 30%, #141e33, #080e1a);
        }

        .speed-card::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            background: conic-gradient(from var(--angle, 0deg), 
                #ff0066, #ff3300, #ffcc00, #33ff66, #00ccff, #9933ff, #ff0066);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning 2s linear infinite;
            filter: blur(4px);
            opacity: 0.7;
        }

        .speed-card::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            background: conic-gradient(from var(--angle, 0deg), 
                #ff0066, #ff3300, #ffcc00, #33ff66, #00ccff, #9933ff, #ff0066);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning 2s linear infinite;
            filter: blur(12px);
            opacity: 0.25;
        }

        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes rgbRunning {
            0% { --angle: 0deg; background-position: 0% 50%; }
            100% { --angle: 360deg; background-position: 100% 50%; }
        }

        .car-animation {
            font-size: 48px;
            margin-bottom: 2px;
            transition: all 0.3s ease;
            display: inline-block;
            filter: drop-shadow(0 0 30px rgba(0, 180, 255, 0.15));
        }

        .car-animation.running {
            animation: carMove 0.6s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 40px rgba(255, 200, 0, 0.4));
        }

        .car-animation.stopped {
            animation: none;
            opacity: 0.5;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.05));
        }

        @keyframes carMove {
            0% { transform: translateX(-8px) scale(1); }
            50% { transform: translateX(0px) scale(1.05); }
            100% { transform: translateX(8px) scale(1); }
        }

        .speed-card .label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .speed-card .value {
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, #6dd5ff, #3a9bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: baseline;
            gap: 4px;
            line-height: 1;
            text-shadow: 0 0 80px rgba(0, 180, 255, 0.1);
        }

        .speed-card .unit {
            font-size: 18px;
            font-weight: 400;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.2);
        }

        .distance-card {
            background: radial-gradient(circle at 30% 30%, #1a2e22, #0a1410);
        }

        .distance-card .inner-bg {
            background: radial-gradient(circle at 30% 30%, #1a2e22, #0a1410);
        }

        .distance-card::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            background: conic-gradient(from var(--angle2, 180deg), 
                #9933ff, #0066ff, #00ccff, #33ff66, #ffcc00, #ff3300, #ff0066, #9933ff);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning2 2.5s linear infinite;
            filter: blur(4px);
            opacity: 0.6;
        }

        .distance-card::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            background: conic-gradient(from var(--angle2, 180deg), 
                #9933ff, #0066ff, #00ccff, #33ff66, #ffcc00, #ff3300, #ff0066, #9933ff);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning2 2.5s linear infinite;
            filter: blur(12px);
            opacity: 0.2;
        }

        @property --angle2 {
            syntax: '<angle>';
            initial-value: 180deg;
            inherits: false;
        }

        @keyframes rgbRunning2 {
            0% { --angle2: 180deg; background-position: 0% 50%; }
            100% { --angle2: 540deg; background-position: 100% 50%; }
        }

        .distance-card .icon {
            font-size: 28px;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 30px rgba(0, 255, 150, 0.12));
        }

        .distance-card .label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .distance-card .value {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #7dffb3, #3dcc7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: baseline;
            gap: 4px;
            line-height: 1;
            text-shadow: 0 0 80px rgba(0, 255, 150, 0.06);
        }

        .distance-card .unit {
            font-size: 16px;
            font-weight: 400;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.2);
        }

        .status-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            width: 100%;
            padding: 2px 0;
        }

        .status-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1px;
            text-align: center;
            font-weight: 300;
        }

        .status-text.active {
            color: rgba(100, 255, 180, 0.5);
        }

        .status-text.error {
            color: rgba(255, 150, 150, 0.5);
        }

        .rgb-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .rgb-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            animation: dotCharge 1.6s ease-in-out infinite;
            box-shadow: 0 0 15px currentColor;
        }

        .rgb-dots span:nth-child(1) { background: #ff0066; color: #ff0066; animation-delay: 0s; }
        .rgb-dots span:nth-child(2) { background: #ffcc00; color: #ffcc00; animation-delay: 0.25s; }
        .rgb-dots span:nth-child(3) { background: #33ff66; color: #33ff66; animation-delay: 0.5s; }
        .rgb-dots span:nth-child(4) { background: #0066ff; color: #0066ff; animation-delay: 0.75s; }
        .rgb-dots span:nth-child(5) { background: #9933ff; color: #9933ff; animation-delay: 1s; }

        @keyframes dotCharge {
            0%, 100% { transform: scale(0.5); opacity: 0.15; box-shadow: 0 0 5px currentColor; }
            50% { transform: scale(1.8); opacity: 1; box-shadow: 0 0 25px currentColor, 0 0 50px currentColor; }
        }

        .button-area {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            justify-content: center;
            align-items: center;
            margin-top: 4px;
        }

        .btn-track {
            padding: 10px 25px;
            font-size: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 8px 30px rgba(0, 150, 255, 0.12);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-transform: uppercase;
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 42px;
        }

        .btn-track::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 52px;
            background: conic-gradient(from 0deg, 
                #ff0066, #ff3300, #ffcc00, #33ff66, #00ccff, #9933ff, #ff0066);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning 2s linear infinite;
            opacity: 0;
            transition: opacity 0.4s ease;
            filter: blur(6px);
        }

        .btn-track:hover::before { opacity: 0.5; }
        .btn-track:hover { transform: scale(1.03); box-shadow: 0 10px 40px rgba(0, 150, 255, 0.2); }
        .btn-track:active { transform: scale(0.95); }
        .btn-track.stop { background: linear-gradient(135deg, #f09819, #d35400); }

        .btn-reset {
            padding: 10px 14px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 42px;
            min-height: 42px;
        }

        .btn-reset:hover {
            background: rgba(255, 50, 50, 0.15);
            border-color: rgba(255, 50, 50, 0.3);
            color: #ff6b6b;
            transform: scale(1.05);
        }
        .btn-reset:active { transform: scale(0.9); }

        @media (max-width: 420px) {
            .circle-card { max-width: 250px; }
            .speed-card .value { font-size: 44px; }
            .speed-card .unit { font-size: 15px; }
            .distance-card .value { font-size: 38px; }
            .distance-card .unit { font-size: 13px; }
            .car-animation { font-size: 38px; }
            .btn-track { padding: 8px 18px; font-size: 11px; min-height: 38px; }
            .btn-reset { padding: 8px 12px; font-size: 13px; min-height: 38px; min-width: 38px; }
            .container { padding: 10px 8px 6px; gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="circle-card speed-card">
            <div class="inner-bg"></div>
            <div class="content">
                <div class="car-animation stopped" id="carIcon">🚗</div>
                <div class="label">স্পিড</div>
                <div class="value" id="speedDisplay">0.0 <span class="unit">km/h</span></div>
            </div>
        </div>

        <div class="circle-card distance-card">
            <div class="inner-bg"></div>
            <div class="content">
                <div class="icon">📍</div>
                <div class="label">দূরত্ব</div>
                <div class="value" id="distanceDisplay">0.00 <span class="unit">km</span></div>
            </div>
        </div>

        <div class="status-area">
            <div class="status-text" id="statusText">🛰️ ট্র্যাকিং শুরু করতে ক্লিক করুন</div>
            <div class="rgb-dots">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>

        <div class="button-area">
            <button class="btn-track" id="trackBtn">▶ শুরু</button>
            <button class="btn-reset" id="resetBtn" title="রিসেট">↺</button>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            const speedEl = document.getElementById('speedDisplay');
            const distanceEl = document.getElementById('distanceDisplay');
            const trackBtn = document.getElementById('trackBtn');
            const resetBtn = document.getElementById('resetBtn');
            const statusText = document.getElementById('statusText');
            const carIcon = document.getElementById('carIcon');

            function createParticles() {
                const container = document.getElementById('particles');
                for (let i = 0; i < 20; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    const size = Math.random() * 4 + 2;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDuration = (Math.random() * 20 + 15) + 's';
                    particle.style.animationDelay = (Math.random() * 20) + 's';
                    particle.style.background = `rgba(${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 255}, 0.04)`;
                    container.appendChild(particle);
                }
            }
            createParticles();

            let lastLat = null;
            let lastLon = null;
            let lastTime = null;
            let totalDistance = 0;
            let watchId = null;
            let isTracking = false;
            
            // স্মার্ট ফিল্টারিং সেটিংস
            const MAX_ACCURACY_THRESHOLD = 15; // ১৫ মিটারের চেয়ে খারাপ সংকেত বাদ
            const MIN_STABLE_DISTANCE = 0.012;  // ১২ মিটার পর্যন্ত জিপিএস লাফানো হলে তা দূরত্বে যোগ হবে না
            const MIN_REAL_SPEED = 1.2;         // ১.২ km/h এর নিচে থাকলে পুরোপুরি ০ দেখাবে
            
            let speedBuffer = [];

            function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
                const R = 6371000;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c; 
            }

            function updateUI(speedKmH, distanceKm, isMoving) {
                speedEl.innerHTML = `${speedKmH.toFixed(1)} <span class="unit">km/h</span>`;
                distanceEl.innerHTML = `${distanceKm.toFixed(2)} <span class="unit">km</span>`;
                carIcon.className = isMoving ? 'car-animation running' : 'car-animation stopped';
            }

            function handlePosition(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const accuracy = position.coords.accuracy;
                const currentTime = position.timestamp;

                // দুর্বল স্যাটেলাইট সংকেত বাদ
                if (accuracy > MAX_ACCURACY_THRESHOLD) {
                    statusText.textContent = '⚠️ দুর্বল সিগন্যাল (স্থির মোড)';
                    statusText.className = 'status-text error';
                    updateUI(0, totalDistance, false);
                    return;
                }

                let rawSpeed = 0;

                if (position.coords.speed !== null && position.coords.speed >= 0) {
                    rawSpeed = position.coords.speed * 3.6;
                } else if (lastLat !== null && lastLon !== null && lastTime !== null) {
                    const distM = calculateDistanceMeters(lastLat, lastLon, lat, lon);
                    const timeS = (currentTime - lastTime) / 1000;
                    if (timeS > 0) {
                        rawSpeed = (distM / timeS) * 3.6;
                    }
                }

                // গতি বাফার তৈরি (স্মুথ ফিল্টারিং)
                speedBuffer.push(rawSpeed);
                if (speedBuffer.length > 3) speedBuffer.shift();
                
                let avgSpeed = speedBuffer.reduce((a, b) => a + b, 0) / speedBuffer.length;

                // এক জায়গায় থাকার ফিল্টার
                if (avgSpeed < MIN_REAL_SPEED) {
                    avgSpeed = 0;
                }

                const isMoving = avgSpeed > 0;

                // দূরত্ব গণনার কড়া ফিল্টার
                if (lastLat !== null && lastLon !== null) {
                    const distKm = calculateDistanceMeters(lastLat, lastLon, lat, lon) / 1000;
                    
                    // আপনি যদি সত্যি নড়াচড়া করেন এবং মিনিমাম ১২ মিটারের দূরত্ব পার করেন
                    if (isMoving && distKm >= MIN_STABLE_DISTANCE) {
                        totalDistance += distKm;
                        lastLat = lat;
                        lastLon = lon;
                        lastTime = currentTime;
                    }
                } else {
                    lastLat = lat;
                    lastLon = lon;
                    lastTime = currentTime;
                }

                updateUI(avgSpeed, totalDistance, isMoving);

                if (isMoving) {
                    statusText.textContent = avgSpeed < 6 ? '🚶 হাঁটা শনাক্ত হয়েছে' : '🚗 রানিং মোড';
                    statusText.className = 'status-text active';
                } else {
                    statusText.textContent = '🅿️ অবস্থান একদম স্থির (০.০)';
                    statusText.className = 'status-text';
                }
            }

            function handleError(error) {
                statusText.textContent = '⚠️ GPS কানেকশন পাওয়া যাচ্ছে না';
                statusText.className = 'status-text error';
                updateUI(0, totalDistance, false);
            }

            function startTracking() {
                if (!("geolocation" in navigator)) {
                    alert("আপনার ব্রাউজারে GPS সাপোর্ট নেই।");
                    return;
                }

                if (isTracking) {
                    stopTracking();
                    return;
                }

                watchId = navigator.geolocation.watchPosition(
                    handlePosition,
                    handleError,
                    {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 5000
                    }
                );

                isTracking = true;
                trackBtn.textContent = '⏹ থামান';
                trackBtn.className = 'btn-track stop';
                statusText.textContent = '📡 স্যাটেলাইট কানেক্ট হচ্ছে...';
                statusText.className = 'status-text';
            }

            function stopTracking() {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                isTracking = false;
                speedBuffer = [];
                trackBtn.textContent = '▶ শুরু';
                trackBtn.className = 'btn-track';
                statusText.textContent = '⏸ ট্র্যাকিং বন্ধ';
                statusText.className = 'status-text';
                updateUI(0, totalDistance, false);
            }

            function resetAll() {
                if (isTracking) stopTracking();
                totalDistance = 0;
                lastLat = null;
                lastLon = null;
                lastTime = null;
                speedBuffer = [];
                updateUI(0, 0, false);
                statusText.textContent = '🔄 রিসেট সম্পূর্ণ হয়েছে';
                statusText.className = 'status-text';
            }

            trackBtn.addEventListener('click', startTracking);
            resetBtn.addEventListener('click', resetAll);

        })();
    </script>
</body>
</html>
