<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্পিড ও দূরত্ব ট্র্যাকার</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #0b1120, #1a2639);
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 400px;
        }

        /* গ্লাসমরফিজম কার্ড */
        .glass-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 60px 60px 40px 40px;
            padding: 25px 20px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
        }

        /* বৃত্তাকার মিটারের জন্য র‍্যাপার */
        .circle-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 10px 0 5px;
        }

        /* প্রতিটি বৃত্তাকার কার্ড */
        .circle-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.15), rgba(0, 0, 0, 0.5));
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 -3px 8px rgba(0, 0, 0, 0.4), inset 0 3px 8px rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            position: relative;
        }

        /* স্পিড কার্ডের বিশেষ গ্রেডিয়েন্ট বর্ডার ইফেক্ট */
        .circle-card.speed-card {
            background: radial-gradient(circle at 30% 30%, #2b3c5e, #141e30);
            border: 2px solid rgba(0, 200, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 150, 255, 0.2), inset 0 -3px 8px rgba(0, 0, 0, 0.6);
        }

        .circle-card.distance-card {
            background: radial-gradient(circle at 30% 30%, #2a4b3c, #0f261b);
            border: 2px solid rgba(0, 255, 180, 0.25);
            box-shadow: 0 0 25px rgba(0, 255, 150, 0.15), inset 0 -3px 8px rgba(0, 0, 0, 0.6);
        }

        .circle-card .label {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .circle-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            line-height: 1.2;
            display: flex;
            align-items: baseline;
            gap: 3px;
        }

        .circle-card .unit {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
            margin-left: 2px;
        }

        /* স্পিড কার্ডের রঙিন নম্বর */
        .speed-card .value {
            color: #6dd5ff;
            text-shadow: 0 0 30px rgba(0, 180, 255, 0.4);
        }

        .distance-card .value {
            color: #7dffb3;
            text-shadow: 0 0 30px rgba(0, 255, 150, 0.3);
        }

        /* বাটন স্টাইল */
        .btn-track {
            width: 100%;
            padding: 18px 10px;
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            letter-spacing: 1.5px;
            box-shadow: 0 12px 30px rgba(0, 150, 255, 0.25);
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            margin-top: 10px;
        }

        .btn-track:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 150, 255, 0.4);
            background: linear-gradient(135deg, #00c6ff, #0072b0);
        }

        .btn-track:active {
            transform: scale(0.97);
        }

        /* ছোট ডিভাইসের জন্য রেসপন্সিভ */
        @media (max-width: 450px) {
            .circle-card {
                width: 120px;
                height: 120px;
            }
            .circle-card .value {
                font-size: 26px;
            }
            .circle-card .label {
                font-size: 11px;
            }
            .btn-track {
                font-size: 17px;
                padding: 16px;
            }
        }

        @media (max-width: 360px) {
            .circle-card {
                width: 100px;
                height: 100px;
            }
            .circle-card .value {
                font-size: 22px;
            }
        }

        /* ড্যাশবোর্ডের নিচে ছোট স্ট্যাটাস টেক্সট */
        .status-text {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            letter-spacing: 1px;
            margin-top: 8px;
            text-align: center;
        }

        /* অ্যানিমেশন: লোডিং এরর জন্য নরম পালস */
        @keyframes pulseGlow {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .circle-card .value.pulse {
            animation: pulseGlow 1.8s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- স্পিড কার্ড (বৃত্ত) -->
        <div class="glass-card">
            <div class="circle-wrapper">
                <div class="circle-card speed-card">
                    <span class="label">🚀 গতি</span>
                    <div class="value" id="speedDisplay">
                        0.0 <span class="unit">km/h</span>
                    </div>
                </div>
                <!-- দূরত্ব কার্ড (বৃত্ত) -->
                <div class="circle-card distance-card">
                    <span class="label">📍 দূরত্ব</span>
                    <div class="value" id="distanceDisplay">
                        0.00 <span class="unit">km</span>
                    </div>
                </div>
            </div>
            <!-- বাটন -->
            <button class="btn-track" id="trackBtn">▶ ট্র্যাকিং শুরু করুন</button>
            <div class="status-text" id="statusText">🛰️ GPS সিগন্যালের জন্য অপেক্ষা...</div>
        </div>

    </div>

    <script>
        (function() {
            "use strict";

            // ডম এলিমেন্ট
            const speedEl = document.getElementById('speedDisplay');
            const distanceEl = document.getElementById('distanceDisplay');
            const trackBtn = document.getElementById('trackBtn');
            const statusText = document.getElementById('statusText');

            // ভেরিয়েবল
            let lastLat = null;
            let lastLon = null;
            let totalDistance = 0; // km
            let watchId = null;
            let isTracking = false;

            // হ্যাভারসাইন দূরত্ব (km)
            function calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371; 
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            // UI আপডেট (স্পিড + দূরত্ব)
            function updateUI(speedKmH, distanceKm) {
                // স্পিড
                if (speedKmH !== undefined && speedKmH !== null) {
                    speedEl.innerHTML = `${speedKmH.toFixed(1)} <span class="unit">km/h</span>`;
                } else {
                    speedEl.innerHTML = `0.0 <span class="unit">km/h</span>`;
                }

                // দূরত্ব
                if (distanceKm !== undefined && distanceKm !== null) {
                    distanceEl.innerHTML = `${distanceKm.toFixed(2)} <span class="unit">km</span>`;
                } else {
                    distanceEl.innerHTML = `0.00 <span class="unit">km</span>`;
                }
            }

            // লোকেশন কলব্যাক
            function handlePosition(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const speedMps = position.coords.speed; // m/s (null হতে পারে)

                // স্পিড কিমি/ঘন্টা
                let speedKmH = 0;
                if (speedMps !== null && speedMps >= 0) {
                    speedKmH = speedMps * 3.6;
                } else {
                    // স্পিড না এলে পূর্ববর্তী পয়েন্টের সাথে সময়ের ব্যবধান ধরে হিসাব (ঐচ্ছিক)
                    // কিন্তু এখানে আমরা শুধু GPS স্পিড ব্যবহার করছি
                    speedKmH = 0;
                }

                // দূরত্ব হিসাব (যদি আগের লোকেশন থাকে)
                if (lastLat !== null && lastLon !== null) {
                    const dist = calculateDistance(lastLat, lastLon, lat, lon);
                    // ৫ মিটার (0.005 km) এর কম নয়েজ এড়িয়ে চলি
                    if (dist > 0.005) {
                        totalDistance += dist;
                    }
                }

                // শেষ লোকেশন আপডেট
                lastLat = lat;
                lastLon = lon;

                // UI আপডেট
                updateUI(speedKmH, totalDistance);
                statusText.innerText = '✅ ট্র্যাকিং সচল';
                statusText.style.color = 'rgba(100, 255, 180, 0.7)';
            }

            // এরর হ্যান্ডেল
            function handleError(error) {
                let msg = 'GPS লোকেশন পেতে সমস্যা: ';
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        msg += 'অনুমতি অস্বীকৃত।';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        msg += 'লোকেশন পাওয়া যাচ্ছে না।';
                        break;
                    case error.TIMEOUT:
                        msg += 'টাইম আউট।';
                        break;
                    default:
                        msg += error.message;
                }
                statusText.innerText = '⚠️ ' + msg;
                statusText.style.color = 'rgba(255, 150, 150, 0.8)';
                // তবুও UI রিসেট না
            }

            // ট্র্যাকিং শুরু
            function startTracking() {
                if (!("geolocation" in navigator)) {
                    alert("আপনার ব্রাউজার Geolocation সাপোর্ট করে না।");
                    return;
                }

                if (isTracking) {
                    // ইতিমধ্যে চলছে — থামান
                    stopTracking();
                    return;
                }

                // রিসেট (যদি নতুন শুরু করতে চান)
                // আমরা কিন্তু আগের দূরত্ব রিসেট করব না, কারণ ইউজার চাইলে আবার শুরু করতে পারে
                // তবে বাটনে ক্লিক করলে রিসেট করতে চাইলে নিচের লাইন আনকমেন্ট করুন:
                // totalDistance = 0;
                // lastLat = null; lastLon = null;
                // updateUI(0, totalDistance);

                // প্রথমে লোকেশন ওয়াচ শুরু
                watchId = navigator.geolocation.watchPosition(
                    handlePosition,
                    handleError,
                    {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 8000
                    }
                );

                isTracking = true;
                trackBtn.innerText = '⏹ ট্র্যাকিং থামান';
                trackBtn.style.background = 'linear-gradient(135deg, #f09819, #d35400)';
                statusText.innerText = '📡 লোকেশন সংগ্রহ করা হচ্ছে...';
                statusText.style.color = 'rgba(255, 220, 100, 0.8)';

                // যদি আগের লোকেশন না থাকে, তাহলে প্রথম লোকেশন পেতে অপেক্ষা
                // কয়েক সেকেন্ড পর যদি আপডেট না আসে, মেসেজ দেখানো যেতে পারে
            }

            // ট্র্যাকিং বন্ধ
            function stopTracking() {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                isTracking = false;
                trackBtn.innerText = '▶ ট্র্যাকিং শুরু করুন';
                trackBtn.style.background = 'linear-gradient(135deg, #00b4db, #0083b0)';
                statusText.innerText = '⏸ ট্র্যাকিং বন্ধ';
                statusText.style.color = 'rgba(255, 255, 255, 0.4)';
            }

            // বাটন ক্লিক ইভেন্ট
            trackBtn.addEventListener('click', startTracking);

            // পেজ লোড হলে UI ডিফল্ট দেখান
            updateUI(0, 0);
            statusText.innerText = '🛰️ শুরু করতে বাটনে ক্লিক করুন';

            // ক্লিনআপ (পেজ আনলোড হলে ওয়াচ বন্ধ)
            window.addEventListener('beforeunload', function() {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                }
            });

        })();
    </script>
</body>
</html>
