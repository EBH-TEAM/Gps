<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেইল ও পাসওয়ার্ড এক্সট্রাক্টর</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #eee;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .input-section {
            background: #0f3460;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 15px;
            border: 2px solid #1a1a2e;
            border-radius: 8px;
            background: #16213e;
            color: #eee;
            font-size: 14px;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
            font-family: monospace;
        }

        textarea:focus {
            border-color: #00d4ff;
        }

        textarea::placeholder {
            color: #666;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-process {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #1a1a2e;
        }

        .btn-process:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-clear {
            background: #e74c3c;
            color: white;
        }

        .btn-clear:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4);
        }

        .btn-clear-copies {
            background: #f39c12;
            color: #1a1a2e;
        }

        .btn-clear-copies:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(243, 156, 18, 0.4);
        }

        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .result-card {
            background: #0f3460;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-left: 4px solid #00d4ff;
            animation: fadeIn 0.4s ease;
            position: relative;
        }

        .result-card.fully-copied {
            border-left-color: #2ecc71;
            background: linear-gradient(135deg, #0f3460, #1e5631);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 12px;
            background: #1a1a2e;
            color: #888;
        }

        .status-badge.done {
            background: #2ecc71;
            color: white;
        }

        .result-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .result-row:last-child {
            margin-bottom: 0;
        }

        .label {
            font-size: 0.8rem;
            color: #aaa;
            min-width: 80px;
            font-weight: bold;
        }

        .value-box {
            flex: 1;
            padding: 10px 14px;
            background: #16213e;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
            word-break: break-all;
            border: 2px solid transparent;
            user-select: none;
            position: relative;
            padding-right: 40px;
        }

        .value-box:hover {
            background: #1a2a4a;
            border-color: #00d4ff;
        }

        .value-box.copied {
            background: #1e5631;
            border-color: #2ecc71;
            color: #2ecc71;
        }

        .value-box.copied .copy-icon {
            display: none;
        }

        .value-box.copied::after {
            content: '✓';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: #2ecc71;
            font-weight: bold;
        }

        .copy-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.6;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1rem;
        }

        .count-badge {
            display: inline-block;
            background: #00d4ff;
            color: #1a1a2e;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 15px;
            margin-right: 8px;
        }

        .count-badge.copied-badge {
            background: #2ecc71;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #2ecc71;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(46, 204, 113, 0.4);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .info-text {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            margin-top: 10px;
        }

        .save-indicator {
            font-size: 0.75rem;
            color: #2ecc71;
            text-align: center;
            margin-top: 5px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .save-indicator.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.3rem; }
            .result-row { flex-direction: column; align-items: stretch; }
            .label { min-width: auto; }
            .value-box { font-size: 0.85rem; }
            .label { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 মেইল ও পাসওয়ার্ড এক্সট্রাক্টর</h1>

        <div class="input-section">
            <textarea id="inputData" placeholder="এখানে আপনার ডেটা পেস্ট করুন...&#10;ফরম্যাট: email|password|link&#10;প্রতি লাইনে একটি এন্ট্রি"></textarea>
            <div class="btn-group">
                <button class="btn-process" onclick="processData()">➕ অ্যাড করুন</button>
                <button class="btn-clear-copies" onclick="clearCopyStatus()">🔄 কপি স্ট্যাটাস রিসেট</button>
                <button class="btn-clear" onclick="clearAll()">🗑️ সব মুছুন</button>
            </div>
            <div class="save-indicator" id="saveIndicator">💾 স্বয়ংক্রিয়ভাবে সেভ হয়েছে</div>
        </div>

        <div id="results" class="results-section">
            <div>
                <span id="countBadge" class="count-badge"></span>
                <span id="copiedBadge" class="count-badge copied-badge"></span>
            </div>
            <div id="resultList"></div>
        </div>
    </div>

    <div id="toast" class="toast">✓ কপি হয়েছে!</div>

    <script>
        // localStorage কী
        const STORAGE_KEY = 'emailPasswordData';
        const COPIED_KEY = 'emailPasswordCopied';

        // কপি করা আইটেম ট্র্যাক করার জন্য Set
        let copiedItems = new Set();

        // ডেটা লোড করা
        let savedData = [];

        // ============ লোড ফাংশন ============
        function loadFromStorage() {
            try {
                const dataStr = localStorage.getItem(STORAGE_KEY);
                const copiedStr = localStorage.getItem(COPIED_KEY);

                if (dataStr) {
                    savedData = JSON.parse(dataStr);
                }

                if (copiedStr) {
                    const arr = JSON.parse(copiedStr);
                    copiedItems = new Set(arr);
                }

                if (savedData.length > 0) {
                    renderResults(savedData);
                }
            } catch (e) {
                console.error('লোড এরর:', e);
            }
        }

        // ============ সেভ ফাংশন ============
        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData));
                localStorage.setItem(COPIED_KEY, JSON.stringify([...copiedItems]));
                showSaveIndicator();
            } catch (e) {
                console.error('সেভ এরর:', e);
            }
        }

        function showSaveIndicator() {
            const indicator = document.getElementById('saveIndicator');
            indicator.classList.add('show');
            clearTimeout(indicator._timeout);
            indicator._timeout = setTimeout(() => {
                indicator.classList.remove('show');
            }, 1500);
        }

        // ============ ডেটা প্রসেস ============
        function processData() {
            const input = document.getElementById('inputData').value.trim();

            if (!input) {
                alert('অনুগ্রহ করে কিছু ডেটা পেস্ট করুন!');
                return;
            }

            const lines = input.split('\n').filter(line => line.trim() !== '');
            let addedCount = 0;
            let duplicateCount = 0;

            lines.forEach((line) => {
                const parts = line.split('|').map(p => p.trim());

                if (parts.length >= 2) {
                    const email = parts[0];
                    const password = parts[1];

                    if (email && password) {
                        // ডুপ্লিকেট চেক
                        const isDuplicate = savedData.some(
                            item => item.email === email && item.password === password
                        );

                        if (!isDuplicate) {
                            savedData.push({ email, password });
                            addedCount++;
                        } else {
                            duplicateCount++;
                        }
                    }
                }
            });

            if (addedCount === 0 && duplicateCount > 0) {
                alert(`⚠️ সবগুলো এন্ট্রি আগে থেকেই আছে! (${duplicateCount} টি ডুপ্লিকেট)`);
                return;
            }

            if (addedCount === 0) {
                alert('❌ কোনো বৈধ ডেটা পাওয়া যায়নি!');
                return;
            }

            // ইনপুট বক্স ক্লিয়ার
            document.getElementById('inputData').value = '';

            // সেভ এবং রেন্ডার
            saveToStorage();
            renderResults(savedData);

            // সাকসেস মেসেজ
            let msg = `✅ ${addedCount} টি নতুন এন্ট্রি যোগ হয়েছে`;
            if (duplicateCount > 0) {
                msg += ` (${duplicateCount} টি ডুপ্লিকেট বাদ)`;
            }
            showToast(msg);
        }

        // ============ রেন্ডার ============
        function renderResults(data) {
            const resultsSection = document.getElementById('results');
            const resultList = document.getElementById('resultList');
            const countBadge = document.getElementById('countBadge');
            const copiedBadge = document.getElementById('copiedBadge');

            if (data.length === 0) {
                resultList.innerHTML = '<div class="empty-state">📭 কোনো ডেটা নেই</div>';
                resultsSection.classList.add('active');
                countBadge.textContent = '০ টি এন্ট্রি';
                copiedBadge.textContent = '';
                return;
            }

            // কপি করা কতগুলো সম্পূর্ণ
            let fullyCopiedCount = 0;

            resultList.innerHTML = data.map((item, idx) => {
                const emailId = `email-${idx}`;
                const passId = `pass-${idx}`;
                const emailCopied = copiedItems.has(emailId);
                const passCopied = copiedItems.has(passId);
                const bothCopied = emailCopied && passCopied;

                if (bothCopied) fullyCopiedCount++;

                return `
                    <div class="result-card ${bothCopied ? 'fully-copied' : ''}">
                        <div class="result-header">
                            <span>#${idx + 1}</span>
                            <span class="status-badge ${bothCopied ? 'done' : ''}">
                                ${bothCopied ? '✓ সম্পূর্ণ কপি' : (emailCopied || passCopied ? '◐ আংশিক কপি' : '○ কপি হয়নি')}
                            </span>
                        </div>
                        <div class="result-row">
                            <span class="label">📧 মেইল:</span>
                            <div class="value-box ${emailCopied ? 'copied' : ''}" 
                                 id="${emailId}" 
                                 onclick="copyText('${escapeHtml(item.email)}', '${emailId}')">
                                ${escapeHtml(item.email)}
                                <span class="copy-icon">📋</span>
                            </div>
                        </div>
                        <div class="result-row">
                            <span class="label">🔑 পাসওয়ার্ড:</span>
                            <div class="value-box ${passCopied ? 'copied' : ''}" 
                                 id="${passId}" 
                                 onclick="copyText('${escapeHtml(item.password)}', '${passId}')">
                                ${escapeHtml(item.password)}
                                <span class="copy-icon">📋</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            countBadge.textContent = `📊 মোট: ${data.length} টি`;
            if (fullyCopiedCount > 0) {
                copiedBadge.textContent = `✓ কপি হয়েছে: ${fullyCopiedCount} টি`;
            } else {
                copiedBadge.textContent = '';
            }

            resultsSection.classList.add('active');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // ============ কপি ফাংশন ============
        function copyText(text, elementId) {
            const element = document.getElementById(elementId);
            if (!element) return;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    markAsCopied(element, elementId);
                }).catch(() => {
                    fallbackCopy(text, element, elementId);
                });
            } else {
                fallbackCopy(text, element, elementId);
            }
        }

        function fallbackCopy(text, element, elementId) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                markAsCopied(element, elementId);
            } catch (err) {
                console.error('কপি ব্যর্থ:', err);
            }
            document.body.removeChild(textarea);
        }

        function markAsCopied(element, elementId) {
            element.classList.add('copied');
            copiedItems.add(elementId);

            // localStorage এ সেভ
            saveToStorage();

            // UI আপডেট - স্ট্যাটাস ব্যাজ আপডেট
            updateCardStatus(elementId);

            showToast('✓ কপি হয়েছে!');
        }

        // কার্ডের স্ট্যাটাস আপডেট
        function updateCardStatus(elementId) {
            // elementId থেকে index বের করা: "email-0" বা "pass-0"
            const idx = elementId.split('-')[1];
            const emailId = `email-${idx}`;
            const passId = `pass-${idx}`;

            const emailCopied = copiedItems.has(emailId);
            const passCopied = copiedItems.has(passId);
            const bothCopied = emailCopied && passCopied;

            // কার্ড খুঁজে বের করা
            const card = document.getElementById(elementId).closest('.result-card');
            if (!card) return;

            // স্ট্যাটাস ব্যাজ আপডেট
            const badge = card.querySelector('.status-badge');
            if (badge) {
                if (bothCopied) {
                    badge.textContent = '✓ সম্পূর্ণ কপি';
                    badge.classList.add('done');
                    card.classList.add('fully-copied');
                } else if (emailCopied || passCopied) {
                    badge.textContent = '◐ আংশিক কপি';
                    badge.classList.remove('done');
                    card.classList.remove('fully-copied');
                } else {
                    badge.textContent = '○ কপি হয়নি';
                    badge.classList.remove('done');
                    card.classList.remove('fully-copied');
                }
            }

            // কাউন্ট ব্যাজ আপডেট
            updateCopiedCount();
        }

        function updateCopiedCount() {
            const copiedBadge = document.getElementById('copiedBadge');
            let fullyCopiedCount = 0;

            for (let i = 0; i < savedData.length; i++) {
                if (copiedItems.has(`email-${i}`) && copiedItems.has(`pass-${i}`)) {
                    fullyCopiedCount++;
                }
            }

            if (fullyCopiedCount > 0) {
                copiedBadge.textContent = `✓ কপি হয়েছে: ${fullyCopiedCount} টি`;
            } else {
                copiedBadge.textContent = '';
            }
        }

        // ============ কপি স্ট্যাটাস রিসেট ============
        function clearCopyStatus() {
            if (copiedItems.size === 0) {
                showToast('ℹ️ কোনো কপি স্ট্যাটাস নেই');
                return;
            }

            if (confirm('সব কপি স্ট্যাটাস রিসেট করতে চান? (মেইল/পাসওয়ার্ড মুছে যাবে না)')) {
                copiedItems.clear();
                saveToStorage();
                renderResults(savedData);
                showToast('🔄 কপি স্ট্যাটাস রিসেট হয়েছে');
            }
        }

        // ============ সব মুছুন ============
        function clearAll() {
            if (savedData.length === 0) {
                showToast('ℹ️ মুছে ফেলার মতো কিছু নেই');
                return;
            }

            if (confirm(`আপনি কি নিশ্চিত? ${savedData.length} টি এন্ট্রি স্থায়ীভাবে মুছে যাবে!`)) {
                savedData = [];
                copiedItems.clear();
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(COPIED_KEY);
                document.getElementById('inputData').value = '';
                document.getElementById('results').classList.remove('active');
                document.getElementById('resultList').innerHTML = '';
                showToast('🗑️ সব ডেটা মুছে ফেলা হয়েছে');
            }
        }

        // ============ টোস্ট ============
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ============ Ctrl+Enter দিয়ে প্রসেস ============
        document.getElementById('inputData').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                processData();
            }
        });

        // ============ পেজ লোড হলে ডেটা লোড ============
        window.addEventListener('load', () => {
            loadFromStorage();
        });
    </script>
</body>
</html>
