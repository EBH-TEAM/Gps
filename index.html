<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBH Speed Meter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #04080c;
            color: #ffffff;
            overflow: hidden;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
            background: radial-gradient(circle at 50% 30%, #0c1622, #04080c 80%);
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
        }

        .brand-name {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00e5cc;
            text-shadow: 0 0 8px rgba(0, 229, 204, 0.4);
        }

        .gps-status {
            font-size: 11px;
            color: #5b6e82;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .gps-dot {
            width: 8px;
            height: 8px;
            background-color: #ff3366;
            border-radius: 50%;
        }

        .gps-dot.active {
            background-color: #00e5cc;
            box-shadow: 0 0 10px #00e5cc;
        }

        .gauge-area {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 52vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .needle {
            stroke: #00e5cc;
            stroke-width: 3.5;
            stroke-linecap: round;
            transform-origin: 150px 150px;
            transition: transform 0.2s cubic-bezier(0.1, 0.6, 0.2, 1);
            filter: drop-shadow(0 0 8px #00e5cc);
        }

        .digital-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -20px;
        }

        .speed-number {
            font-size: 80px;
            font-weight: 800;
            color: #00e5cc;
            line-height: 0.9;
            text-shadow: 0 0 25px rgba(0, 229, 204, 0.4);
        }

        .unit {
            font-size: 13px;
            color: #5b6e82;
            letter-spacing: 4px;
            margin-top: 8px;
            font-weight: 700;
        }

        .bottom-section {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 10px;
        }

        .stats-panel {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background: rgba(12, 22, 34, 0.6);
            border-radius: 14px;
            padding: 15px 5px;
            border: 1px solid rgba(0, 229, 204, 0.08);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-box:last-child {
            border-right: none;
        }

        .stat-label {
            font-size: 10px;
            color: #5b6e82;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #ffcc00;
        }

        .stat-value.cyan {
            color: #00e5cc;
        }

        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-start {
            background: #00e5cc;
            color: #04080c;
            box-shadow: 0 0 20px rgba(0, 229, 204, 0.3);
        }

        .btn-start.stop {
            background: #ff3366;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.3);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.05);
            color: #5b6e82;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-reset:active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="top-bar">
            <div class="brand-name">EBH SPEED METER</div>
            <div class="gps-status">
                <div class="gps-dot" id="gpsDot"></div>
                <span id="gpsText">GPS OFF</span>
            </div>
        </div>

        <div class="gauge-area">
            <svg class="gauge-svg" viewBox="0 0 300 300">
                <defs>
                    <linearGradient id="gauge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00e5cc" />
                        <stop offset="60%" stop-color="#ffcc00" />
                        <stop offset="100%" stop-color="#ff3366" />
                    </linearGradient>
                </defs>

                <path d="M 40 230 A 130 130 0 1 1 260 230" fill="none" stroke="#101924" stroke-width="12" stroke-linecap="round"/>
                
                <path id="gaugeArc" d="M 40 230 A 130 130 0 1 1 260 230" fill="none" stroke="url(#gauge-grad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="610" stroke-dashoffset="610"/>

                <!-- 0 to 50 scale with step 5 -->
                <text x="35" y="238" fill="#5b6e82" font-size="9" font-weight="700" text-anchor="middle">0</text>
                <text x="25" y="195" fill="#5b6e82" font-size="9" font-weight="700" text-anchor="middle">5</text>
                <text x="30" y="148" fill="#5b6e82" font-size="9" font-weight="700" text-anchor="middle">10</text>
                <text x="50" y="105" fill="#5b6e82" font-size="9" font-weight="700" text-anchor="middle">15</text>
                <text x="82" y="70" fill="#5b6e82" font-size="9" font-weight="700" text-anchor="middle">20</text>
                <text x="123" y="52" fill="#5b6e82" font-size="9" font-weight="700" text-anchor="middle">25</text>
                <text x="177" y="52" fill="#ffcc00" font-size="9" font-weight="700" text-anchor="middle">30</text>
                <text x="218" y="70" fill="#ffcc00" font-size="9" font-weight="700" text-anchor="middle">35</text>
                <text x="250" y="105" fill="#ff3366" font-size="9" font-weight="700" text-anchor="middle">40</text>
                <text x="270" y="148" fill="#ff3366" font-size="9" font-weight="700" text-anchor="middle">45</text>
                <text x="265" y="238" fill="#ff3366" font-size="9" font-weight="700" text-anchor="middle">50</text>

                <!-- Needle (Starts at exact 0 angle) -->
                <line id="needle" class="needle" x1="150" y1="150" x2="58" y2="222" />
                
                <circle cx="150" cy="150" r="9" fill="#04080c" stroke="#00e5cc" stroke-width="3"/>
            </svg>
        </div>

        <div class="digital-display">
            <div class="speed-number" id="speedText">0</div>
            <div class="unit">KM / H</div>
        </div>

        <div class="bottom-section">
            <div class="stats-panel">
                <div class="stat-box">
                    <div class="stat-label">AVG</div>
                    <div class="stat-value" id="avgSpeed">0.0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">MAX</div>
                    <div class="stat-value" id="maxSpeed">0.0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">TRIP</div>
                    <div class="stat-value cyan" id="tripDist">0.00</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-start" id="startBtn">START</button>
                <button class="btn btn-reset" id="resetBtn">RESET</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            const speedText = document.getElementById('speedText');
            const avgSpeedEl = document.getElementById('avgSpeed');
            const maxSpeedEl = document.getElementById('maxSpeed');
            const tripDistEl = document.getElementById('tripDist');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const gpsDot = document.getElementById('gpsDot');
            const gpsText = document.getElementById('gpsText');
            const needle = document.getElementById('needle');
            const gaugeArc = document.getElementById('gaugeArc');

            let watchId = null;
            let isTracking = false;

            let currentSpeed = 0;
            let targetSpeed = 0;

            let maxSpeed = parseFloat(localStorage.getItem('ebh_max_speed')) || 0;
            let tripDistance = parseFloat(localStorage.getItem('ebh_trip_dist')) || 0;
            let speedSamples = JSON.parse(localStorage.getItem('ebh_speed_samples')) || [];

            let lastLat = null;
            let lastLon = null;
            let lastTime = null;

            const maxGaugeSpeed = 50; // Max speed set to 50 km/h
            const arcTotalLength = 610;

            function updateGauge(speed) {
                const clamped = Math.min(Math.max(speed, 0), maxGaugeSpeed);
                
                // Needle Rotation Calculation (-135deg for 0 km/h to +135deg for 50 km/h)
                const angle = -135 + (clamped / maxGaugeSpeed) * 270;
                needle.style.transform = `rotate(${angle + 135}deg)`;

                const offset = arcTotalLength - (clamped / maxGaugeSpeed) * arcTotalLength;
                gaugeArc.style.strokeDashoffset = offset;
            }

            function loadSavedStats() {
                maxSpeedEl.textContent = maxSpeed.toFixed(1);
                tripDistEl.textContent = tripDistance.toFixed(2);
                
                if (speedSamples.length > 0) {
                    const avg = speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length;
                    avgSpeedEl.textContent = avg.toFixed(1);
                } else {
                    avgSpeedEl.textContent = "0.0";
                }
            }
            loadSavedStats();
            updateGauge(0);

            function animateLoop() {
                const diff = targetSpeed - currentSpeed;
                if (Math.abs(diff) > 0.05) {
                    currentSpeed += diff * 0.12;
                } else {
                    currentSpeed = targetSpeed;
                }

                const displaySpeed = currentSpeed < 0.2 ? 0 : currentSpeed;
                speedText.textContent = displaySpeed.toFixed(1);
                updateGauge(displaySpeed);

                requestAnimationFrame(animateLoop);
            }
            requestAnimationFrame(animateLoop);

            function calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371000;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            }

            function handlePosition(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const accuracy = pos.coords.accuracy;
                const now = pos.timestamp;

                gpsDot.classList.add('active');
                gpsText.textContent = 'GPS ACTIVE';

                if (accuracy > 60) return;

                if (lastLat === null) {
                    lastLat = lat;
                    lastLon = lon;
                    lastTime = now;
                    return;
                }

                const distM = calculateDistance(lastLat, lastLon, lat, lon);
                const timeS = (now - lastTime) / 1000;

                let calculatedSpeed = 0;

                if (pos.coords.speed !== null && pos.coords.speed >= 0) {
                    calculatedSpeed = pos.coords.speed * 3.6;
                } else if (timeS > 0) {
                    calculatedSpeed = (distM / timeS) * 3.6;
                }

                if (distM < 0.4 && calculatedSpeed < 0.5) {
                    targetSpeed = 0;
                } else {
                    targetSpeed = calculatedSpeed;

                    if (distM >= 0.4) {
                        tripDistance += (distM / 1000);
                        localStorage.setItem('ebh_trip_dist', tripDistance);
                        tripDistEl.textContent = tripDistance.toFixed(2);
                    }

                    if (calculatedSpeed > maxSpeed) {
                        maxSpeed = calculatedSpeed;
                        localStorage.setItem('ebh_max_speed', maxSpeed);
                        maxSpeedEl.textContent = maxSpeed.toFixed(1);
                    }

                    if (calculatedSpeed > 0.5) {
                        speedSamples.push(calculatedSpeed);
                        if (speedSamples.length > 300) speedSamples.shift();
                        localStorage.setItem('ebh_speed_samples', JSON.stringify(speedSamples));
                        
                        const avg = speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length;
                        avgSpeedEl.textContent = avg.toFixed(1);
                    }

                    lastLat = lat;
                    lastLon = lon;
                    lastTime = now;
                }
            }

            function handleError() {
                gpsDot.classList.remove('active');
                gpsText.textContent = 'SEARCHING';
            }

            function toggleTracking() {
                if (!("geolocation" in navigator)) {
                    alert("GPS not supported.");
                    return;
                }

                if (isTracking) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                    isTracking = false;
                    targetSpeed = 0;
                    startBtn.textContent = "START";
                    startBtn.classList.remove("stop");
                    gpsDot.classList.remove("active");
                    gpsText.textContent = "GPS OFF";
                } else {
                    watchId = navigator.geolocation.watchPosition(
                        handlePosition,
                        handleError,
                        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                    );
                    isTracking = true;
                    startBtn.textContent = "STOP";
                    startBtn.classList.add("stop");
                    gpsText.textContent = "CONNECTING";
                }
            }

            function resetAll() {
                if (isTracking) toggleTracking();
                
                maxSpeed = 0;
                tripDistance = 0;
                speedSamples = [];
                targetSpeed = 0;
                currentSpeed = 0;
                lastLat = null;
                lastLon = null;

                localStorage.removeItem('ebh_max_speed');
                localStorage.removeItem('ebh_trip_dist');
                localStorage.removeItem('ebh_speed_samples');

                loadSavedStats();
                speedText.textContent = "0.0";
                updateGauge(0);
            }

            startBtn.addEventListener('click', toggleTracking);
            resetBtn.addEventListener('click', resetAll);

        })();
    </script>
</body>
</html>
