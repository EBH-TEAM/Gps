<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>স্পিড ট্র্যাকার প্রো</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #070b12;
            padding: 8px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255,0,102,0.04), transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0,102,255,0.04), transparent 50%);
            animation: bgPulse 8s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgPulse {
            0% { transform: scale(1) rotate(0deg); opacity: 0.5; }
            100% { transform: scale(1.2) rotate(5deg); opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 420px;
            min-height: 96vh;
            min-height: 96dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 8px 8px;
            position: relative;
            z-index: 1;
            gap: 8px;
        }

        /* ====== স্পিড কার্ড ====== */
        .speed-circle {
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at 30% 30%, #141e33, #080e1a);
            transition: transform 0.3s ease;
            margin-top: 2px;
        }

        .speed-circle::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: conic-gradient(from var(--angle, 0deg), 
                #ff0066, #ff3300, #ffcc00, #33ff66, #00ccff, #9933ff, #ff0066);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning 2s linear infinite;
            filter: blur(3px);
            opacity: 0.7;
        }

        .speed-circle::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 50%;
            background: conic-gradient(from var(--angle, 0deg), 
                #ff0066, #ff3300, #ffcc00, #33ff66, #00ccff, #9933ff, #ff0066);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning 2s linear infinite;
            filter: blur(8px);
            opacity: 0.3;
        }

        .speed-circle .inner-bg {
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #141e33, #080e1a);
            z-index: 0;
        }

        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes rgbRunning {
            0% { --angle: 0deg; background-position: 0% 50%; }
            100% { --angle: 360deg; background-position: 100% 50%; }
        }

        .speed-circle .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .speed-circle .icon {
            font-size: 28px;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 25px rgba(0, 180, 255, 0.2));
        }

        .speed-circle .label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .speed-circle .value {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #6dd5ff, #3a9bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: baseline;
            gap: 3px;
            line-height: 1;
            text-shadow: 0 0 60px rgba(0, 180, 255, 0.1);
        }

        .speed-circle .unit {
            font-size: 16px;
            font-weight: 400;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.2);
        }

        /* ====== লোকেশন ডিটেইলস কার্ড ====== */
        .location-card {
            width: 100%;
            max-width: 360px;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .location-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 26px;
            background: conic-gradient(from 0deg, 
                #ff0066, #ff3300, #ffcc00, #33ff66, #00ccff, #9933ff, #ff0066);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning 3s linear infinite;
            opacity: 0.15;
            filter: blur(4px);
        }

        .location-card .inner {
            position: relative;
            z-index: 1;
        }

        .location-card .loc-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .location-card .loc-header .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #33ff66;
            animation: dotPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(51, 255, 102, 0.3);
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .location-card .loc-header .title {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .location-card .loc-header .status-badge {
            margin-left: auto;
            font-size: 10px;
            padding: 3px 12px;
            border-radius: 20px;
            background: rgba(51, 255, 102, 0.1);
            color: #33ff66;
            border: 1px solid rgba(51, 255, 102, 0.15);
        }

        .location-card .loc-main {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .location-card .loc-coords {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
            letter-spacing: 0.5px;
            font-family: 'Courier New', monospace;
        }

        .location-card .loc-road {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-card .loc-road .road-icon {
            font-size: 16px;
            opacity: 0.5;
        }

        .location-card .loc-places {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .location-card .loc-places span {
            font-size: 11px;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
            letter-spacing: 0.3px;
        }

        .location-card .loc-places span.active {
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* ====== দূরত্ব কার্ড ====== */
        .distance-circle {
            width: 100%;
            max-width: 200px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at 30% 30%, #1a2e22, #0a1410);
            transition: transform 0.3s ease;
        }

        .distance-circle::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: conic-gradient(from var(--angle2, 180deg), 
                #9933ff, #0066ff, #00ccff, #33ff66, #ffcc00, #ff3300, #ff0066, #9933ff);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning2 2.5s linear infinite;
            filter: blur(3px);
            opacity: 0.6;
        }

        .distance-circle::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 50%;
            background: conic-gradient(from var(--angle2, 180deg), 
                #9933ff, #0066ff, #00ccff, #33ff66, #ffcc00, #ff3300, #ff0066, #9933ff);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning2 2.5s linear infinite;
            filter: blur(8px);
            opacity: 0.25;
        }

        .distance-circle .inner-bg {
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1a2e22, #0a1410);
            z-index: 0;
        }

        @property --angle2 {
            syntax: '<angle>';
            initial-value: 180deg;
            inherits: false;
        }

        @keyframes rgbRunning2 {
            0% { --angle2: 180deg; background-position: 0% 50%; }
            100% { --angle2: 540deg; background-position: 100% 50%; }
        }

        .distance-circle .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .distance-circle .icon {
            font-size: 24px;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 25px rgba(0, 255, 150, 0.15));
        }

        .distance-circle .label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .distance-circle .value {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #7dffb3, #3dcc7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: baseline;
            gap: 3px;
            line-height: 1;
            text-shadow: 0 0 60px rgba(0, 255, 150, 0.08);
        }

        .distance-circle .unit {
            font-size: 13px;
            font-weight: 400;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.2);
        }

        /* ====== স্ট্যাটাস ====== */
        .status-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            width: 100%;
            padding: 2px 0;
        }

        .status-text {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            text-align: center;
            font-weight: 300;
        }

        .status-text.active {
            color: rgba(100, 255, 180, 0.5);
        }

        .status-text.error {
            color: rgba(255, 150, 150, 0.5);
        }

        .rgb-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .rgb-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            animation: dotCharge 1.6s ease-in-out infinite;
            box-shadow: 0 0 15px currentColor;
        }

        .rgb-dots span:nth-child(1) { background: #ff0066; color: #ff0066; animation-delay: 0s; }
        .rgb-dots span:nth-child(2) { background: #ffcc00; color: #ffcc00; animation-delay: 0.25s; }
        .rgb-dots span:nth-child(3) { background: #33ff66; color: #33ff66; animation-delay: 0.5s; }
        .rgb-dots span:nth-child(4) { background: #0066ff; color: #0066ff; animation-delay: 0.75s; }
        .rgb-dots span:nth-child(5) { background: #9933ff; color: #9933ff; animation-delay: 1s; }

        @keyframes dotCharge {
            0%, 100% { transform: scale(0.5); opacity: 0.15; box-shadow: 0 0 5px currentColor; }
            50% { transform: scale(1.8); opacity: 1; box-shadow: 0 0 25px currentColor, 0 0 50px currentColor; }
        }

        /* ====== বাটন ====== */
        .button-area {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 340px;
            justify-content: center;
            align-items: center;
        }

        .btn-track {
            padding: 10px 25px;
            font-size: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 8px 30px rgba(0, 150, 255, 0.12);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-transform: uppercase;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .btn-track::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 52px;
            background: conic-gradient(from 0deg, 
                #ff0066, #ff3300, #ffcc00, #33ff66, #00ccff, #9933ff, #ff0066);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning 2s linear infinite;
            opacity: 0;
            transition: opacity 0.4s ease;
            filter: blur(6px);
        }

        .btn-track:hover::before { opacity: 0.5; }
        .btn-track:hover { transform: scale(1.03); box-shadow: 0 10px 40px rgba(0, 150, 255, 0.2); }
        .btn-track:active { transform: scale(0.95); }
        .btn-track.stop { background: linear-gradient(135deg, #f09819, #d35400); }

        .btn-reset {
            padding: 10px 15px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
        }

        .btn-reset:hover {
            background: rgba(255, 50, 50, 0.15);
            border-color: rgba(255, 50, 50, 0.3);
            color: #ff6b6b;
            transform: scale(1.05);
        }
        .btn-reset:active { transform: scale(0.9); }

        /* ====== রেসপন্সিভ ====== */
        @media (max-width: 420px) {
            .speed-circle { max-width: 220px; }
            .distance-circle { max-width: 160px; }
            .speed-circle .value { font-size: 38px; }
            .speed-circle .unit { font-size: 14px; }
            .distance-circle .value { font-size: 30px; }
            .distance-circle .unit { font-size: 12px; }
            .speed-circle .icon { font-size: 24px; }
            .distance-circle .icon { font-size: 20px; }
            .location-card { padding: 14px 16px; max-width: 320px; }
            .location-card .loc-road { font-size: 16px; }
            .location-card .loc-coords { font-size: 12px; }
            .btn-track { padding: 8px 18px; font-size: 11px; }
            .btn-reset { padding: 8px 12px; font-size: 13px; min-width: 38px; }
        }

        @media (max-width: 360px) {
            .speed-circle { max-width: 180px; }
            .distance-circle { max-width: 130px; }
            .speed-circle .value { font-size: 30px; }
            .speed-circle .unit { font-size: 12px; }
            .distance-circle .value { font-size: 24px; }
            .distance-circle .unit { font-size: 10px; }
            .speed-circle .icon { font-size: 20px; }
            .distance-circle .icon { font-size: 16px; }
            .location-card { padding: 12px 14px; max-width: 280px; }
            .location-card .loc-road { font-size: 14px; }
            .location-card .loc-coords { font-size: 11px; }
            .location-card .loc-places span { font-size: 10px; padding: 3px 10px; }
        }

        @media (max-height: 700px) {
            .speed-circle { max-width: 180px; }
            .distance-circle { max-width: 130px; }
            .speed-circle .value { font-size: 30px; }
            .distance-circle .value { font-size: 24px; }
            .speed-circle .icon { font-size: 20px; }
            .distance-circle .icon { font-size: 16px; }
            .location-card { padding: 12px 14px; max-width: 300px; }
            .location-card .loc-road { font-size: 14px; }
            .btn-track { padding: 8px 16px; font-size: 10px; }
            .btn-reset { padding: 8px 12px; font-size: 12px; }
            .container { padding: 6px 6px 4px; gap: 5px; }
            .speed-circle .label, .distance-circle .label { font-size: 9px; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ====== স্পিড ====== -->
        <div class="speed-circle">
            <div class="inner-bg"></div>
            <div class="content">
                <div class="icon">🚀</div>
                <div class="label">স্পিড</div>
                <div class="value" id="speedDisplay">0.0 <span class="unit">km/h</span></div>
            </div>
        </div>

        <!-- ====== লোকেশন ডিটেইলস ====== -->
        <div class="location-card">
            <div class="inner">
                <div class="loc-header">
                    <span class="dot"></span>
                    <span class="title">📍 বর্তমান অবস্থান</span>
                    <span class="status-badge" id="statusBadge">লাইভ</span>
                </div>
                <div class="loc-main">
                    <div class="loc-coords" id="coordDisplay">23.71066, 90.45224</div>
                    <div class="loc-road">
                        <span class="road-icon">🛣️</span>
                        <span id="roadDisplay">JATRA_BARI</span>
                    </div>
                    <div class="loc-places" id="placesDisplay">
                        <span class="active">📍 Dania College</span>
                        <span>🚉 Rail Station</span>
                        <span>🏫 Shams School</span>
                        <span>📍 MATUAIL</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ====== দূরত্ব ====== -->
        <div class="distance-circle">
            <div class="inner-bg"></div>
            <div class="content">
                <div class="icon">📍</div>
                <div class="label">দূরত্ব</div>
                <div class="value" id="distanceDisplay">0.00 <span class="unit">km</span></div>
            </div>
        </div>

        <!-- ====== স্ট্যাটাস ====== -->
        <div class="status-area">
            <div class="status-text" id="statusText">🛰️ শুরু করতে বাটনে ক্লিক করুন</div>
            <div class="rgb-dots">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>

        <!-- ====== বাটন ====== -->
        <div class="button-area">
            <button class="btn-track" id="trackBtn">▶ শুরু</button>
            <button class="btn-reset" id="resetBtn" title="রিসেট">↺</button>
        </div>

    </div>

    <script>
        (function() {
            "use strict";

            const speedEl = document.getElementById('speedDisplay');
            const distanceEl = document.getElementById('distanceDisplay');
            const trackBtn = document.getElementById('trackBtn');
            const resetBtn = document.getElementById('resetBtn');
            const statusText = document.getElementById('statusText');
            const statusBadge = document.getElementById('statusBadge');
            const coordDisplay = document.getElementById('coordDisplay');
            const roadDisplay = document.getElementById('roadDisplay');
            const placesDisplay = document.getElementById('placesDisplay');

            // ====== ভেরিয়েবল ======
            let lastLat = null;
            let lastLon = null;
            let totalDistance = 0;
            let watchId = null;
            let isTracking = false;
            let lastSpeed = 0;
            let speedFilter = [];
            const FILTER_SIZE = 5;
            const STORAGE_KEY = 'speedTrackerData';

            // ====== লোকাল স্টোরেজ ======
            function saveData() {
                try {
                    const data = {
                        totalDistance: totalDistance,
                        lastLat: lastLat,
                        lastLon: lastLon,
                        lastSpeed: lastSpeed,
                        timestamp: Date.now()
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch(e) {}
            }

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    totalDistance = data.totalDistance || 0;
                    lastLat = data.lastLat || null;
                    lastLon = data.lastLon || null;
                    lastSpeed = data.lastSpeed || 0;
                    return true;
                } catch(e) { return false; }
            }

            function clearData() {
                try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
            }

            // ====== ফিল্টার ======
            function getFilteredSpeed(newSpeed) {
                speedFilter.push(newSpeed);
                if (speedFilter.length > FILTER_SIZE) {
                    speedFilter.shift();
                }
                const sorted = [...speedFilter].sort((a, b) => a - b);
                const mid = Math.floor(sorted.length / 2);
                let filtered = sorted[mid];
                
                // যদি গতি 0.8 km/h এর কম হয় তাহলে 0
                if (filtered < 0.8) {
                    filtered = 0;
                }
                return filtered;
            }

            // ====== দূরত্ব ======
            function calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            // ====== লোকেশন ডিটেইলস আপডেট ======
            function updateLocationDetails(lat, lon) {
                coordDisplay.textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                
                // রাস্তার নাম (ডেমো - রিয়েল প্রজেক্টে Reverse Geocoding API ব্যবহার করতে হবে)
                const roads = ['JATRA_BARI', 'MATUAIL Road', 'Dhaka-Mawa Highway', 'Airport Road', 'Gulshan Avenue'];
                const randomRoad = roads[Math.floor(Math.random() * roads.length)];
                roadDisplay.textContent = randomRoad;

                // আশেপাশের জায়গা
                const places = [
                    'Dania College', 'Rail Station', 'Shams School', 
                    'MATUAIL', 'Jatra Bari', 'R110', 'Z1102'
                ];
                // এলোমেলো ৩-৪টি প্লেস দেখান
                const shuffled = places.sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 4);
                placesDisplay.innerHTML = selected.map(p => 
                    `<span class="active">📍 ${p}</span>`
                ).join('');
            }

            // ====== UI ======
            function updateUI(speedKmH, distanceKm) {
                if (speedKmH !== undefined && speedKmH !== null && speedKmH >= 0) {
                    speedEl.innerHTML = `${speedKmH.toFixed(1)} <span class="unit">km/h</span>`;
                } else {
                    speedEl.innerHTML = `0.0 <span class="unit">km/h</span>`;
                }

                if (distanceKm !== undefined && distanceKm !== null && distanceKm >= 0) {
                    distanceEl.innerHTML = `${distanceKm.toFixed(2)} <span class="unit">km</span>`;
                } else {
                    distanceEl.innerHTML = `0.00 <span class="unit">km</span>`;
                }
            }

            // ====== লোকেশন ======
            function handlePosition(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const speedMps = position.coords.speed;
                const accuracy = position.coords.accuracy;

                if (accuracy > 50) {
                    statusText.textContent = '⚠️ GPS সিগন্যাল দুর্বল';
                    statusText.className = 'status-text error';
                    return;
                }

                let rawSpeed = 0;
                if (speedMps !== null && speedMps >= 0) {
                    rawSpeed = speedMps * 3.6;
                }

                let filteredSpeed = getFilteredSpeed(rawSpeed);

                // দূরত্ব শুধু চলাকালীন
                if (lastLat !== null && lastLon !== null) {
                    const dist = calculateDistance(lastLat, lastLon, lat, lon);
                    if (filteredSpeed > 0.5 && dist > 0.003) {
                        totalDistance += dist;
                    }
                }

                lastLat = lat;
                lastLon = lon;
                lastSpeed = filteredSpeed;

                // লোকেশন ডিটেইলস আপডেট
                updateLocationDetails(lat, lon);

                updateUI(filteredSpeed, totalDistance);
                statusText.textContent = '✅ ট্র্যাকিং সচল';
                statusText.className = 'status-text active';
                statusBadge.textContent = 'লাইভ';
                statusBadge.style.color = '#33ff66';
                statusBadge.style.borderColor = 'rgba(51, 255, 102, 0.3)';
                
                saveData();
            }

            function handleError(error) {
                let msg = 'GPS সমস্যা: ';
                switch(error.code) {
                    case error.PERMISSION_DENIED: msg += 'অনুমতি অস্বীকৃত'; break;
                    case error.POSITION_UNAVAILABLE: msg += 'লোকেশন নেই'; break;
                    case error.TIMEOUT: msg += 'টাইম আউট'; break;
                    default: msg += error.message;
                }
                statusText.textContent = '⚠️ ' + msg;
                statusText.className = 'status-text error';
                statusBadge.textContent = 'অফলাইন';
                statusBadge.style.color = '#ff6b6b';
                statusBadge.style.borderColor = 'rgba(255, 107, 107, 0.3)';
            }

            // ====== ট্র্যাকিং ======
            function startTracking() {
                if (!("geolocation" in navigator)) {
                    alert("আপনার ব্রাউজার Geolocation সাপোর্ট করে না।");
                    return;
                }

                if (isTracking) {
                    stopTracking();
                    return;
                }

                watchId = navigator.geolocation.watchPosition(
                    handlePosition,
                    handleError,
                    {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 10000
                    }
                );

                isTracking = true;
                trackBtn.textContent = '⏹ থামান';
                trackBtn.className = 'btn-track stop';
                statusText.textContent = '📡 লোকেশন সংগ্রহ...';
                statusText.className = 'status-text';
            }

            function stopTracking() {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                isTracking = false;
                trackBtn.textContent = '▶ শুরু';
                trackBtn.className = 'btn-track';
                statusText.textContent = '⏸ ট্র্যাকিং বন্ধ';
                statusText.className = 'status-text';
                statusBadge.textContent = 'স্ট্যান্ডবাই';
                statusBadge.style.color = 'rgba(255,255,255,0.3)';
                statusBadge.style.borderColor = 'rgba(255,255,255,0.1)';
                saveData();
            }

            // ====== রিসেট ======
            function resetAll() {
                if (isTracking) stopTracking();
                
                totalDistance = 0;
                lastLat = null;
                lastLon = null;
                lastSpeed = 0;
                speedFilter = [];
                
                updateUI(0, 0);
                coordDisplay.textContent = '--.----- , --.-----';
                roadDisplay.textContent = 'রাস্তা খুঁজুন...';
                placesDisplay.innerHTML = '<span>📍 লোকেশন পাওয়া যায়নি</span>';
                statusText.textContent = '🔄 রিসেট করা হয়েছে';
                statusText.className = 'status-text';
                statusBadge.textContent = 'রিসেট';
                statusBadge.style.color = 'rgba(255,255,255,0.3)';
                statusBadge.style.borderColor = 'rgba(255,255,255,0.1)';
                clearData();
                
                setTimeout(() => {
                    if (!isTracking) {
                        statusText.textContent = '🛰️ শুরু করতে বাটনে ক্লিক করুন';
                        statusText.className = 'status-text';
                    }
                }, 2000);
            }

            // ====== রিস্টোর ======
            function restoreData() {
                if (loadData()) {
                    updateUI(lastSpeed, totalDistance);
                    if (lastLat && lastLon) {
                        updateLocationDetails(lastLat, lastLon);
                    }
                    if (totalDistance > 0 || lastSpeed > 0) {
                        statusText.textContent = '💾 আগের ডাটা রিস্টোর';
                        statusText.className = 'status-text';
                        setTimeout(() => {
                            if (!isTracking) {
                                statusText.textContent = '🛰️ শুরু করতে বাটনে ক্লিক করুন';
                                statusText.className = 'status-text';
                            }
                        }, 2500);
                    }
                }
            }

            // ====== ইভেন্ট ======
            trackBtn.addEventListener('click', startTracking);
            resetBtn.addEventListener('click', resetAll);

            window.addEventListener('beforeunload', function() {
                if (isTracking) saveData();
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            });

            // ====== শুরু ======
            restoreData();
            if (!isTracking) {
                updateUI(0, 0);
            }

        })();
    </script>
</body>
</html>
