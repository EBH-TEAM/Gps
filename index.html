<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS Speed Tracker</title>

<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    padding-top:50px;
}

h3{
    color:#aaa;
    margin:15px 0 5px;
}

.value{
    font-size:48px;
    font-weight:bold;
    margin-bottom:25px;
}

button{
    padding:12px 25px;
    font-size:18px;
}
</style>
</head>

<body>

<h3>স্পিড</h3>
<div class="value" id="speed">0.0 km/h</div>

<h3>দূরত্ব</h3>
<div class="value" id="distance">0.00 km</div>

<button id="btn">▶ শুরু</button>

<script>
"use strict";

let watchId = null;
let running = false;

let lastLat = null;
let lastLon = null;
let lastTime = null;

let totalDistance = 0;
let currentSpeed = 0;

let speedSamples = [];
let stationaryCount = 0;

const speedEl = document.getElementById("speed");
const distanceEl = document.getElementById("distance");
const btn = document.getElementById("btn");


// দুই GPS অবস্থানের দূরত্ব
function getDistance(lat1, lon1, lat2, lon2){

    const R = 6371000;
    const p = Math.PI / 180;

    const a =
        Math.sin((lat2-lat1)*p/2) ** 2 +
        Math.cos(lat1*p) *
        Math.cos(lat2*p) *
        Math.sin((lon2-lon1)*p/2) ** 2;

    return R * 2 *
        Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}


// Speed smooth করা
function smoothSpeed(value){

    speedSamples.push(value);

    if(speedSamples.length > 5){
        speedSamples.shift();
    }

    const sorted = [...speedSamples].sort((a,b)=>a-b);

    // মাঝের reading নেওয়া
    return sorted[Math.floor(sorted.length/2)];
}


// GPS data
function handleGPS(position){

    const lat = position.coords.latitude;
    const lon = position.coords.longitude;

    const accuracy = position.coords.accuracy;
    const gpsSpeed = position.coords.speed;

    const time = position.timestamp;

    // খুব খারাপ GPS signal বাদ
    if(accuracy > 60){
        return;
    }


    // প্রথম GPS point
    if(lastLat === null){

        lastLat = lat;
        lastLon = lon;
        lastTime = time;

        currentSpeed = 0;

        updateScreen();
        return;
    }


    const meters = getDistance(
        lastLat,
        lastLon,
        lat,
        lon
    );

    const seconds =
        (time - lastTime) / 1000;

    if(seconds <= 0){
        return;
    }


    /*
       GPS speed পাওয়া গেলে
       সেটাকে সবচেয়ে বেশি গুরুত্ব দেওয়া হবে।
    */

    let calculatedSpeed = null;

    if(
        gpsSpeed !== null &&
        Number.isFinite(gpsSpeed) &&
        gpsSpeed >= 0
    ){

        calculatedSpeed =
            gpsSpeed * 3.6;

    }else{

        // GPS speed না থাকলে
        // distance/time দিয়ে speed

        calculatedSpeed =
            (meters / seconds) * 3.6;
    }


    /*
       GPS jitter থেকে বাঁচার জন্য
       movement threshold।

       হাঁটার সময় 2m movement-ও
       ধরা হবে।
    */

    const movementThreshold =
        Math.max(2, accuracy * 0.25);


    /*
       স্থির থাকা শনাক্ত করা
    */

    if(
        meters < movementThreshold &&
        calculatedSpeed < 1.5
    ){

        stationaryCount++;

    }else{

        stationaryCount = 0;
    }


    /*
       কয়েকবার পরপর স্থির থাকলে
       speed = 0
    */

    if(stationaryCount >= 2){

        currentSpeed = 0;
        speedSamples = [];

    }else{

        /*
           অস্বাভাবিক GPS jump বাদ
        */

        if(calculatedSpeed <= 200){

            currentSpeed =
                smoothSpeed(calculatedSpeed);
        }
    }


    /*
       Valid movement হলে
       Distance যোগ হবে।
    */

    if(
        meters >= movementThreshold &&
        calculatedSpeed <= 200
    ){

        totalDistance += meters / 1000;

        lastLat = lat;
        lastLon = lon;
        lastTime = time;

    }else if(stationaryCount >= 2){

        /*
           দাঁড়িয়ে থাকলে reference point
           update করা হবে না,
           যাতে GPS jitter distance না বাড়ায়।
        */

    }


    // খুব কম speed হলে zero
    if(currentSpeed < 0.5){
        currentSpeed = 0;
    }


    updateScreen();
}


// Screen update
function updateScreen(){

    speedEl.textContent =
        currentSpeed.toFixed(1) + " km/h";

    distanceEl.textContent =
        totalDistance.toFixed(2) + " km";
}


// GPS error
function gpsError(){

    currentSpeed = 0;
    updateScreen();
}


// Start
function startTracking(){

    if(!navigator.geolocation){

        alert("এই ডিভাইসে GPS পাওয়া যায়নি।");
        return;
    }


    watchId =
        navigator.geolocation.watchPosition(
            handleGPS,
            gpsError,
            {
                enableHighAccuracy:true,
                maximumAge:0,
                timeout:15000
            }
        );


    running = true;

    btn.textContent = "⏹ বন্ধ";
}


// Stop
function stopTracking(){

    if(watchId !== null){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    running = false;

    currentSpeed = 0;

    speedSamples = [];

    lastLat = null;
    lastLon = null;
    lastTime = null;

    updateScreen();

    btn.textContent = "▶ শুরু";
}


// Button
btn.addEventListener("click",function(){

    if(running){

        stopTracking();

    }else{

        startTracking();
    }

});


updateScreen();

</script>

</body>
</html>
