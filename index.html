<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBH Speed Meter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #04080c;
            color: #ffffff;
            overflow: hidden;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px 25px 12px; /* Bottom padding keeps content safe from mobile navbar */
            background: radial-gradient(circle at 50% 30%, #0c1622, #04080c 80%);
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
            height: 30px;
        }

        .brand-name {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #00e5cc;
            text-shadow: 0 0 8px rgba(0, 229, 204, 0.4);
        }

        .top-right-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gps-status {
            font-size: 10px;
            color: #5b6e82;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .gps-dot {
            width: 7px;
            height: 7px;
            background-color: #ff3366;
            border-radius: 50%;
        }

        .gps-dot.active {
            background-color: #00e5cc;
            box-shadow: 0 0 10px #00e5cc;
        }

        /* Top Reset Button */
        .btn-reset-top {
            background: rgba(255, 255, 255, 0.08);
            color: #a0b2c6;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-reset-top:active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.25);
        }

        /* Large Gauge Container */
        .gauge-area {
            position: relative;
            width: 100%;
            max-width: 480px;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .needle {
            stroke: #00e5cc;
            stroke-width: 3.5;
            stroke-linecap: round;
            transform-origin: 150px 135px;
            transition: transform 0.05s linear;
            filter: drop-shadow(0 0 8px #00e5cc);
        }

        /* Speed Text Positioned Inside Gauge */
        .digital-display {
            position: absolute;
            bottom: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .speed-number {
            font-size: 65px;
            font-weight: 800;
            color: #00e5cc;
            line-height: 0.8;
            text-shadow: 0 0 20px rgba(0, 229, 204, 0.4);
        }

        .unit {
            font-size: 10px;
            color: #5b6e82;
            letter-spacing: 3px;
            margin-top: 2px;
            font-weight: 700;
        }

        /* Bottom Section */
        .bottom-section {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
        }

        .stats-panel {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background: rgba(12, 22, 34, 0.7);
            border-radius: 10px;
            padding: 10px 4px;
            border: 1px solid rgba(0, 229, 204, 0.08);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-box:last-child {
            border-right: none;
        }

        .stat-label {
            font-size: 9px;
            color: #5b6e82;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: #ffcc00;
        }

        .stat-value.cyan {
            color: #00e5cc;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="top-bar">
            <div class="brand-name">EBH SPEED METER</div>
            <div class="top-right-controls">
                <div class="gps-status">
                    <div class="gps-dot" id="gpsDot"></div>
                    <span id="gpsText">GPS OFF</span>
                </div>
                <button class="btn-reset-top" id="resetBtn">RESET</button>
            </div>
        </div>

        <div class="gauge-area">
            <svg class="gauge-svg" viewBox="10 10 280 230">
                <defs>
                    <linearGradient id="gauge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00e5cc" />
                        <stop offset="60%" stop-color="#ffcc00" />
                        <stop offset="100%" stop-color="#ff3366" />
                    </linearGradient>
                </defs>

                <path d="M 30 210 A 130 130 0 1 1 270 210" fill="none" stroke="#101924" stroke-width="14" stroke-linecap="round"/>
                
                <path id="gaugeArc" d="M 30 210 A 130 130 0 1 1 270 210" fill="none" stroke="url(#gauge-grad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="610" stroke-dashoffset="610"/>

                <text x="25" y="218" fill="#5b6e82" font-size="10" font-weight="700" text-anchor="middle">0</text>
                <text x="18" y="170" fill="#5b6e82" font-size="10" font-weight="700" text-anchor="middle">5</text>
                <text x="25" y="120" fill="#5b6e82" font-size="10" font-weight="700" text-anchor="middle">10</text>
                <text x="48" y="75" fill="#5b6e82" font-size="10" font-weight="700" text-anchor="middle">15</text>
                <text x="82" y="42" fill="#5b6e82" font-size="10" font-weight="700" text-anchor="middle">20</text>
                <text x="126" y="24" fill="#5b6e82" font-size="10" font-weight="700" text-anchor="middle">25</text>
                <text x="174" y="24" fill="#ffcc00" font-size="10" font-weight="700" text-anchor="middle">30</text>
                <text x="218" y="42" fill="#ffcc00" font-size="10" font-weight="700" text-anchor="middle">35</text>
                <text x="252" y="75" fill="#ff3366" font-size="10" font-weight="700" text-anchor="middle">40</text>
                <text x="275" y="120" fill="#ff3366" font-size="10" font-weight="700" text-anchor="middle">45</text>
                <text x="275" y="218" fill="#ff3366" font-size="10" font-weight="700" text-anchor="middle">50</text>

                <line id="needle" class="needle" x1="150" y1="135" x2="58" y2="207" />
                
                <circle cx="150" cy="135" r="9" fill="#04080c" stroke="#00e5cc" stroke-width="3"/>
            </svg>

            <div class="digital-display">
                <div class="speed-number" id="speedText">0.0</div>
                <div class="unit">KM / H</div>
            </div>
        </div>

        <div class="bottom-section">
            <div class="stats-panel">
                <div class="stat-box">
                    <div class="stat-label">AVG</div>
                    <div class="stat-value" id="avgSpeed">0.0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">MAX</div>
                    <div class="stat-value" id="maxSpeed">0.0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">TRIP</div>
                    <div class="stat-value cyan" id="tripDist">0.00</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            const speedText = document.getElementById('speedText');
            const avgSpeedEl = document.getElementById('avgSpeed');
            const maxSpeedEl = document.getElementById('maxSpeed');
            const tripDistEl = document.getElementById('tripDist');
            const resetBtn = document.getElementById('resetBtn');
            const gpsDot = document.getElementById('gpsDot');
            const gpsText = document.getElementById('gpsText');
            const needle = document.getElementById('needle');
            const gaugeArc = document.getElementById('gaugeArc');

            let watchId = null;

            let currentSpeed = 0;
            let targetSpeed = 0;

            let maxSpeed = parseFloat(localStorage.getItem('ebh_max_speed')) || 0;
            let tripDistance = parseFloat(localStorage.getItem('ebh_trip_dist')) || 0;
            let speedSamples = JSON.parse(localStorage.getItem('ebh_speed_samples')) || [];

            let lastLat = null;
            let lastLon = null;
            let lastTime = null;

            const maxGaugeSpeed = 50;
            const arcTotalLength = 610;

            function updateGauge(speed) {
                const clamped = Math.min(Math.max(speed, 0), maxGaugeSpeed);
                
                const angle = -135 + (clamped / maxGaugeSpeed) * 270;
                needle.style.transform = `rotate(${angle + 135}deg)`;

                const offset = arcTotalLength - (clamped / maxGaugeSpeed) * arcTotalLength;
                gaugeArc.style.strokeDashoffset = offset;
            }

            function loadSavedStats() {
                maxSpeedEl.textContent = maxSpeed.toFixed(1);
                tripDistEl.textContent = tripDistance.toFixed(2);
                
                if (speedSamples.length > 0) {
                    const avg = speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length;
                    avgSpeedEl.textContent = avg.toFixed(1);
                } else {
                    avgSpeedEl.textContent = "0.0";
                }
            }
            loadSavedStats();
            updateGauge(0);

            function animateLoop() {
                const diff = targetSpeed - currentSpeed;
                if (Math.abs(diff) > 0.01) {
                    currentSpeed += diff * 0.4;
                } else {
                    currentSpeed = targetSpeed;
                }

                const displaySpeed = currentSpeed < 0.1 ? 0 : currentSpeed;
                speedText.textContent = displaySpeed.toFixed(1);
                updateGauge(displaySpeed);

                requestAnimationFrame(animateLoop);
            }
            requestAnimationFrame(animateLoop);

            function calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371000;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            }

            function handlePosition(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const accuracy = pos.coords.accuracy;
                const now = pos.timestamp;

                gpsDot.classList.add('active');
                gpsText.textContent = 'GPS ACTIVE';

                if (accuracy > 80) return;

                if (lastLat === null) {
                    lastLat = lat;
                    lastLon = lon;
                    lastTime = now;
                    return;
                }

                const distM = calculateDistance(lastLat, lastLon, lat, lon);
                const timeS = (now - lastTime) / 1000;

                let calculatedSpeed = 0;

                if (pos.coords.speed !== null && pos.coords.speed >= 0) {
                    calculatedSpeed = pos.coords.speed * 3.6;
                } else if (timeS > 0) {
                    calculatedSpeed = (distM / timeS) * 3.6;
                }

                targetSpeed = calculatedSpeed;

                if (distM >= 0.2) {
                    tripDistance += (distM / 1000);
                    localStorage.setItem('ebh_trip_dist', tripDistance);
                    tripDistEl.textContent = tripDistance.toFixed(2);
                }

                if (calculatedSpeed > maxSpeed) {
                    maxSpeed = calculatedSpeed;
                    localStorage.setItem('ebh_max_speed', maxSpeed);
                    maxSpeedEl.textContent = maxSpeed.toFixed(1);
                }

                if (calculatedSpeed > 0.2) {
                    speedSamples.push(calculatedSpeed);
                    if (speedSamples.length > 300) speedSamples.shift();
                    localStorage.setItem('ebh_speed_samples', JSON.stringify(speedSamples));
                    
                    const avg = speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length;
                    avgSpeedEl.textContent = avg.toFixed(1);
                }

                lastLat = lat;
                lastLon = lon;
                lastTime = now;
            }

            function handleError() {
                gpsDot.classList.remove('active');
                gpsText.textContent = 'SEARCHING';
            }

            // Auto-start GPS function
            function startAutoTracking() {
                if (!("geolocation" in navigator)) {
                    alert("GPS not supported.");
                    return;
                }

                gpsText.textContent = "CONNECTING";
                watchId = navigator.geolocation.watchPosition(
                    handlePosition,
                    handleError,
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            }

            function resetAll() {
                maxSpeed = 0;
                tripDistance = 0;
                speedSamples = [];
                targetSpeed = 0;
                currentSpeed = 0;
                lastLat = null;
                lastLon = null;

                localStorage.removeItem('ebh_max_speed');
                localStorage.removeItem('ebh_trip_dist');
                localStorage.removeItem('ebh_speed_samples');

                loadSavedStats();
                speedText.textContent = "0.0";
                updateGauge(0);
            }

            resetBtn.addEventListener('click', resetAll);

            // Trigger auto-start when loaded
            startAutoTracking();

        })();
    </script>
</body>
</html>
