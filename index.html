<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EBH Speed Meter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #06090e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .dashboard {
            width: 100%;
            max-width: 380px;
            background: #0a0f16;
            border-radius: 20px;
            padding: 20px 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid rgba(0, 229, 204, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Top Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .brand-name {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #00e5cc;
            text-transform: uppercase;
        }

        .gps-status {
            font-size: 11px;
            color: #00e5cc;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 1px;
        }

        .gps-dot {
            width: 8px;
            height: 8px;
            background-color: #ff3366;
            border-radius: 50%;
        }

        .gps-dot.active {
            background-color: #00e5cc;
            box-shadow: 0 0 8px #00e5cc;
        }

        /* Gauge Meter Area */
        .gauge-container {
            position: relative;
            width: 100%;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
        }

        .gauge-bg {
            fill: none;
            stroke: #121a24;
            stroke-width: 12;
            stroke-dasharray: 440;
            stroke-dashoffset: 0;
            stroke-linecap: round;
        }

        .gauge-speed {
            fill: none;
            stroke: url(#gauge-gradient);
            stroke-width: 12;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }

        .needle {
            stroke: #00e5cc;
            stroke-width: 3;
            stroke-linecap: round;
            transform-origin: 150px 150px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 6px #00e5cc);
        }

        .needle-center {
            fill: #0a0f16;
            stroke: #00e5cc;
            stroke-width: 3;
        }

        /* Digital Display */
        .digital-display {
            text-align: center;
            margin-top: -30px;
        }

        .speed-number {
            font-size: 64px;
            font-weight: 800;
            color: #00e5cc;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 229, 204, 0.3);
        }

        .unit {
            font-size: 12px;
            color: #5b6e82;
            letter-spacing: 3px;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Stats Cards Panel */
        .stats-panel {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background: #06090e;
            border-radius: 12px;
            padding: 12px 5px;
            border: 1px solid rgba(255,255,255,0.03);
            text-align: center;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .stat-box:last-child {
            border-right: none;
        }

        .stat-label {
            font-size: 10px;
            color: #5b6e82;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #ffb703;
        }

        .stat-value.cyan {
            color: #00e5cc;
        }

        /* Control Buttons */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-start {
            background: #00e5cc;
            color: #06090e;
            box-shadow: 0 0 15px rgba(0, 229, 204, 0.2);
        }

        .btn-start.stop {
            background: #ff3366;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.2);
        }

        .btn-reset {
            background: #121a24;
            color: #5b6e82;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-reset:active {
            color: #ffffff;
            background: #1a2636;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand-name">EBH Speed Meter</div>
            <div class="gps-status">
                <div class="gps-dot" id="gpsDot"></div>
                <span id="gpsText">GPS OFF</span>
            </div>
        </div>

        <!-- Gauge Dial -->
        <div class="gauge-container">
            <svg class="gauge-svg" viewBox="0 0 300 300">
                <defs>
                    <linearGradient id="gauge-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00e5cc" />
                        <stop offset="70%" stop-color="#ffb703" />
                        <stop offset="100%" stop-color="#ff3366" />
                    </linearGradient>
                </defs>

                <!-- Background Arc -->
                <path class="gauge-bg" d="M 50 220 A 120 120 0 1 1 250 220" />
                
                <!-- Speed Arc -->
                <path class="gauge-speed" id="gaugeArc" d="M 50 220 A 120 120 0 1 1 250 220" />

                <!-- Ticks & Numbers -->
                <!-- 0 -->
                <text x="50" y="240" fill="#5b6e82" font-size="10" text-anchor="middle">0</text>
                <!-- 20 -->
                <text x="35" y="160" fill="#5b6e82" font-size="10" text-anchor="middle">20</text>
                <!-- 40 -->
                <text x="65" y="90" fill="#5b6e82" font-size="10" text-anchor="middle">40</text>
                <!-- 60 -->
                <text x="150" y="55" fill="#5b6e82" font-size="10" text-anchor="middle">60</text>
                <!-- 80 -->
                <text x="235" y="90" fill="#5b6e82" font-size="10" text-anchor="middle">80</text>
                <!-- 100 -->
                <text x="265" y="160" fill="#5b6e82" font-size="10" text-anchor="middle">100</text>
                <!-- 120 -->
                <text x="250" y="240" fill="#ff3366" font-size="10" text-anchor="middle">120</text>

                <!-- Needle -->
                <line id="needle" class="needle" x1="150" y1="150" x2="65" y2="215" />
                <circle class="needle-center" cx="150" cy="150" r="8" />
            </svg>
        </div>

        <!-- Digital Speed -->
        <div class="digital-display">
            <div class="speed-number" id="speedText">0</div>
            <div class="unit">KM / H</div>
        </div>

        <!-- Stats Panel -->
        <div class="stats-panel">
            <div class="stat-box">
                <div class="stat-label">AVG</div>
                <div class="stat-value" id="avgSpeed">0.0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">MAX</div>
                <div class="stat-value" id="maxSpeed">0.0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">TRIP</div>
                <div class="stat-value cyan" id="tripDist">0.00</div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="controls">
            <button class="btn btn-start" id="startBtn">START</button>
            <button class="btn btn-reset" id="resetBtn">RESET</button>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // Elements
            const speedText = document.getElementById('speedText');
            const avgSpeedEl = document.getElementById('avgSpeed');
            const maxSpeedEl = document.getElementById('maxSpeed');
            const tripDistEl = document.getElementById('tripDist');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const gpsDot = document.getElementById('gpsDot');
            const gpsText = document.getElementById('gpsText');
            const needle = document.getElementById('needle');
            const gaugeArc = document.getElementById('gaugeArc');

            // Variables
            let watchId = null;
            let isTracking = false;

            let currentSpeed = 0;
            let targetSpeed = 0;
            
            let maxSpeed = parseFloat(localStorage.getItem('ebh_max_speed')) || 0;
            let tripDistance = parseFloat(localStorage.getItem('ebh_trip_dist')) || 0;
            let speedSamples = JSON.parse(localStorage.getItem('ebh_speed_samples')) || [];

            let lastLat = null;
            let lastLon = null;
            let lastTime = null;

            // Gauge Setup (Arc calculation)
            const maxGaugeSpeed = 120; // Gauge capacity 120 km/h
            const arcTotalLength = 565; // Total stroke dash length for arc

            function setGaugeSpeed(speed) {
                // Limit speed for gauge display
                const clampedSpeed = Math.min(Math.max(speed, 0), maxGaugeSpeed);
                
                // Calculate Needle Rotation (-135deg to +135deg)
                const angle = -135 + (clampedSpeed / maxGaugeSpeed) * 270;
                needle.style.transform = `rotate(${angle}deg)`;

                // Calculate Arc Fill
                const offset = arcTotalLength - (clampedSpeed / maxGaugeSpeed) * (arcTotalLength * 0.75);
                gaugeArc.style.strokeDashoffset = offset;
            }

            // Restore Saved Stats
            function updateSavedUI() {
                maxSpeedEl.textContent = maxSpeed.toFixed(1);
                tripDistEl.textContent = tripDistance.toFixed(2);
                
                if (speedSamples.length > 0) {
                    const avg = speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length;
                    avgSpeedEl.textContent = avg.toFixed(1);
                } else {
                    avgSpeedEl.textContent = "0.0";
                }
            }
            updateSavedUI();

            // Smooth Loop for UI Updating
            function animateLoop() {
                const diff = targetSpeed - currentSpeed;
                if (Math.abs(diff) > 0.1) {
                    currentSpeed += diff * 0.1;
                } else {
                    currentSpeed = targetSpeed;
                }

                const displaySpeed = currentSpeed < 0.3 ? 0 : currentSpeed;
                speedText.textContent = Math.round(displaySpeed);
                setGaugeSpeed(displaySpeed);

                requestAnimationFrame(animateLoop);
            }
            requestAnimationFrame(animateLoop);

            // Haversine Distance Calc
            function calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371000;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            }

            // GPS Success Callback
            function handlePosition(pos) {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                const accuracy = pos.coords.accuracy;
                const now = pos.timestamp;

                gpsDot.classList.add('active');
                gpsText.textContent = 'GPS READY';

                if (accuracy > 70) return; // Ignore bad signals

                if (lastLat === null) {
                    lastLat = lat;
                    lastLon = lon;
                    lastTime = now;
                    return;
                }

                const distM = calculateDistance(lastLat, lastLon, lat, lon);
                const timeS = (now - lastTime) / 1000;

                let calculatedSpeed = 0;

                if (pos.coords.speed !== null && pos.coords.speed >= 0) {
                    calculatedSpeed = pos.coords.speed * 3.6;
                } else if (timeS > 0) {
                    calculatedSpeed = (distM / timeS) * 3.6;
                }

                // Filter Walking Noise
                if (distM < 0.4 && calculatedSpeed < 0.5) {
                    targetSpeed = 0;
                } else {
                    targetSpeed = calculatedSpeed;

                    // Update Distance
                    if (distM >= 0.4) {
                        tripDistance += (distM / 1000);
                        localStorage.setItem('ebh_trip_dist', tripDistance);
                        tripDistEl.textContent = tripDistance.toFixed(2);
                    }

                    // Update Max Speed
                    if (calculatedSpeed > maxSpeed) {
                        maxSpeed = calculatedSpeed;
                        localStorage.setItem('ebh_max_speed', maxSpeed);
                        maxSpeedEl.textContent = maxSpeed.toFixed(1);
                    }

                    // Update Average Speed
                    if (calculatedSpeed > 0.5) {
                        speedSamples.push(calculatedSpeed);
                        if (speedSamples.length > 500) speedSamples.shift(); // keep array light
                        localStorage.setItem('ebh_speed_samples', JSON.stringify(speedSamples));
                        
                        const avg = speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length;
                        avgSpeedEl.textContent = avg.toFixed(1);
                    }

                    lastLat = lat;
                    lastLon = lon;
                    lastTime = now;
                }
            }

            function handleError() {
                gpsDot.classList.remove('active');
                gpsText.textContent = 'SEARCHING';
            }

            // Start / Stop Functions
            function toggleTracking() {
                if (!("geolocation" in navigator)) {
                    alert("GPS not supported on your browser.");
                    return;
                }

                if (isTracking) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                    isTracking = false;
                    targetSpeed = 0;
                    startBtn.textContent = "START";
                    startBtn.classList.remove("stop");
                    gpsDot.classList.remove("active");
                    gpsText.textContent = "GPS OFF";
                } else {
                    watchId = navigator.geolocation.watchPosition(
                        handlePosition,
                        handleError,
                        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                    );
                    isTracking = true;
                    startBtn.textContent = "STOP";
                    startBtn.classList.add("stop");
                    gpsText.textContent = "CONNECTING";
                }
            }

            // Reset Function
            function resetAll() {
                if (isTracking) toggleTracking();
                
                maxSpeed = 0;
                tripDistance = 0;
                speedSamples = [];
                targetSpeed = 0;
                currentSpeed = 0;
                lastLat = null;
                lastLon = null;

                localStorage.removeItem('ebh_max_speed');
                localStorage.removeItem('ebh_trip_dist');
                localStorage.removeItem('ebh_speed_samples');

                updateSavedUI();
                speedText.textContent = "0";
                setGaugeSpeed(0);
            }

            startBtn.addEventListener('click', toggleTracking);
            resetBtn.addEventListener('click', resetAll);

        })();
    </script>
</body>
</html>
