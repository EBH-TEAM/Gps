<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>স্পিড ট্র্যাকার প্রো</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #070b12;
            padding: 8px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255,0,102,0.04), transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0,102,255,0.04), transparent 50%);
            animation: bgPulse 8s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgPulse {
            0% { transform: scale(1) rotate(0deg); opacity: 0.5; }
            100% { transform: scale(1.2) rotate(5deg); opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 420px;
            min-height: 96vh;
            min-height: 96dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 8px 8px;
            position: relative;
            z-index: 1;
            gap: 8px;
        }

        /* ====== স্পিড কার্ড ====== */
        .speed-circle {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at 30% 30%, #141e33, #080e1a);
            transition: transform 0.3s ease;
            margin-top: 2px;
        }

        .speed-circle::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: conic-gradient(from var(--angle, 0deg), 
                #ff0066, #ff3300, #ffcc00, #33ff66, #00ccff, #9933ff, #ff0066);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning 2s linear infinite;
            filter: blur(3px);
            opacity: 0.7;
        }

        .speed-circle::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 50%;
            background: conic-gradient(from var(--angle, 0deg), 
                #ff0066, #ff3300, #ffcc00, #33ff66, #00ccff, #9933ff, #ff0066);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning 2s linear infinite;
            filter: blur(8px);
            opacity: 0.3;
        }

        .speed-circle .inner-bg {
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #141e33, #080e1a);
            z-index: 0;
        }

        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes rgbRunning {
            0% { --angle: 0deg; background-position: 0% 50%; }
            100% { --angle: 360deg; background-position: 100% 50%; }
        }

        .speed-circle .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .speed-circle .icon {
            font-size: 32px;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 25px rgba(0, 180, 255, 0.2));
        }

        .speed-circle .label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .speed-circle .value {
            font-size: 52px;
            font-weight: 700;
            background: linear-gradient(135deg, #6dd5ff, #3a9bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: baseline;
            gap: 3px;
            line-height: 1;
            text-shadow: 0 0 60px rgba(0, 180, 255, 0.1);
        }

        .speed-circle .unit {
            font-size: 18px;
            font-weight: 400;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.2);
        }

        /* ====== ম্যাপ কন্টেইনার ====== */
        .map-container {
            width: 100%;
            max-width: 340px;
            height: 160px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: invert(0.9) hue-rotate(180deg);
        }

        /* ====== দূরত্ব কার্ড ====== */
        .distance-circle {
            width: 100%;
            max-width: 240px;
            aspect-ratio: 1/1;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at 30% 30%, #1a2e22, #0a1410);
            transition: transform 0.3s ease;
        }

        .distance-circle::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: conic-gradient(from var(--angle2, 180deg), 
                #9933ff, #0066ff, #00ccff, #33ff66, #ffcc00, #ff3300, #ff0066, #9933ff);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning2 2.5s linear infinite;
            filter: blur(3px);
            opacity: 0.6;
        }

        .distance-circle::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 50%;
            background: conic-gradient(from var(--angle2, 180deg), 
                #9933ff, #0066ff, #00ccff, #33ff66, #ffcc00, #ff3300, #ff0066, #9933ff);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning2 2.5s linear infinite;
            filter: blur(8px);
            opacity: 0.25;
        }

        .distance-circle .inner-bg {
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1a2e22, #0a1410);
            z-index: 0;
        }

        @property --angle2 {
            syntax: '<angle>';
            initial-value: 180deg;
            inherits: false;
        }

        @keyframes rgbRunning2 {
            0% { --angle2: 180deg; background-position: 0% 50%; }
            100% { --angle2: 540deg; background-position: 100% 50%; }
        }

        .distance-circle .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .distance-circle .icon {
            font-size: 28px;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 25px rgba(0, 255, 150, 0.15));
        }

        .distance-circle .label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .distance-circle .value {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #7dffb3, #3dcc7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: baseline;
            gap: 3px;
            line-height: 1;
            text-shadow: 0 0 60px rgba(0, 255, 150, 0.08);
        }

        .distance-circle .unit {
            font-size: 15px;
            font-weight: 400;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.2);
        }

        /* ====== স্ট্যাটাস ====== */
        .status-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 100%;
            padding: 2px 0;
        }

        .status-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            text-align: center;
            font-weight: 300;
        }

        .status-text.active {
            color: rgba(100, 255, 180, 0.5);
        }

        .status-text.error {
            color: rgba(255, 150, 150, 0.5);
        }

        .rgb-dots {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .rgb-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            animation: dotCharge 1.6s ease-in-out infinite;
            box-shadow: 0 0 15px currentColor;
        }

        .rgb-dots span:nth-child(1) { background: #ff0066; color: #ff0066; animation-delay: 0s; }
        .rgb-dots span:nth-child(2) { background: #ffcc00; color: #ffcc00; animation-delay: 0.25s; }
        .rgb-dots span:nth-child(3) { background: #33ff66; color: #33ff66; animation-delay: 0.5s; }
        .rgb-dots span:nth-child(4) { background: #0066ff; color: #0066ff; animation-delay: 0.75s; }
        .rgb-dots span:nth-child(5) { background: #9933ff; color: #9933ff; animation-delay: 1s; }

        @keyframes dotCharge {
            0%, 100% { transform: scale(0.5); opacity: 0.15; box-shadow: 0 0 5px currentColor; }
            50% { transform: scale(1.8); opacity: 1; box-shadow: 0 0 25px currentColor, 0 0 50px currentColor; }
        }

        /* ====== বাটন ====== */
        .button-area {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 340px;
            justify-content: center;
            align-items: center;
        }

        .btn-track {
            padding: 10px 25px;
            font-size: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 8px 30px rgba(0, 150, 255, 0.12);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-transform: uppercase;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .btn-track::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 52px;
            background: conic-gradient(from 0deg, 
                #ff0066, #ff3300, #ffcc00, #33ff66, #00ccff, #9933ff, #ff0066);
            background-size: 300% 300%;
            z-index: -1;
            animation: rgbRunning 2s linear infinite;
            opacity: 0;
            transition: opacity 0.4s ease;
            filter: blur(6px);
        }

        .btn-track:hover::before { opacity: 0.5; }
        .btn-track:hover { transform: scale(1.03); box-shadow: 0 10px 40px rgba(0, 150, 255, 0.2); }
        .btn-track:active { transform: scale(0.95); }
        .btn-track.stop { background: linear-gradient(135deg, #f09819, #d35400); }

        .btn-reset {
            padding: 10px 15px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
        }

        .btn-reset:hover {
            background: rgba(255, 50, 50, 0.15);
            border-color: rgba(255, 50, 50, 0.3);
            color: #ff6b6b;
            transform: scale(1.05);
        }
        .btn-reset:active { transform: scale(0.9); }

        /* ====== রেসপন্সিভ ====== */
        @media (max-width: 420px) {
            .speed-circle { max-width: 240px; }
            .distance-circle { max-width: 190px; }
            .speed-circle .value { font-size: 40px; }
            .speed-circle .unit { font-size: 15px; }
            .distance-circle .value { font-size: 34px; }
            .distance-circle .unit { font-size: 13px; }
            .speed-circle .icon { font-size: 26px; }
            .distance-circle .icon { font-size: 22px; }
            .map-container { height: 130px; max-width: 280px; }
            .btn-track { padding: 8px 18px; font-size: 11px; }
            .btn-reset { padding: 8px 12px; font-size: 13px; min-width: 38px; }
            .status-text { font-size: 10px; }
            .rgb-dots span { width: 6px; height: 6px; gap: 8px; }
        }

        @media (max-width: 360px) {
            .speed-circle { max-width: 190px; }
            .distance-circle { max-width: 150px; }
            .speed-circle .value { font-size: 32px; }
            .speed-circle .unit { font-size: 12px; }
            .distance-circle .value { font-size: 28px; }
            .distance-circle .unit { font-size: 11px; }
            .speed-circle .icon { font-size: 20px; }
            .distance-circle .icon { font-size: 18px; }
            .map-container { height: 110px; max-width: 230px; }
            .speed-circle .label, .distance-circle .label { font-size: 10px; letter-spacing: 2px; }
        }

        @media (max-height: 700px) {
            .speed-circle { max-width: 190px; }
            .distance-circle { max-width: 150px; }
            .speed-circle .value { font-size: 32px; }
            .distance-circle .value { font-size: 28px; }
            .speed-circle .icon { font-size: 20px; }
            .distance-circle .icon { font-size: 18px; }
            .map-container { height: 110px; max-width: 250px; }
            .btn-track { padding: 8px 16px; font-size: 10px; }
            .btn-reset { padding: 8px 12px; font-size: 12px; }
            .status-text { font-size: 10px; }
            .container { padding: 6px 6px 4px; gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ====== স্পিড ====== -->
        <div class="speed-circle">
            <div class="inner-bg"></div>
            <div class="content">
                <div class="icon">🚀</div>
                <div class="label">স্পিড</div>
                <div class="value" id="speedDisplay">0.0 <span class="unit">km/h</span></div>
            </div>
        </div>

        <!-- ====== ম্যাপ ====== -->
        <div class="map-container">
            <iframe id="mapFrame" 
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d14600!2d90.3563!3d23.7772!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sbd!4v1700000000000" 
                allowfullscreen loading="lazy">
            </iframe>
        </div>

        <!-- ====== স্ট্যাটাস ====== -->
        <div class="status-area">
            <div class="status-text" id="statusText">🛰️ শুরু করতে বাটনে ক্লিক করুন</div>
            <div class="rgb-dots">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>

        <!-- ====== দূরত্ব ====== -->
        <div class="distance-circle">
            <div class="inner-bg"></div>
            <div class="content">
                <div class="icon">📍</div>
                <div class="label">দূরত্ব</div>
                <div class="value" id="distanceDisplay">0.00 <span class="unit">km</span></div>
            </div>
        </div>

        <!-- ====== বাটন ====== -->
        <div class="button-area">
            <button class="btn-track" id="trackBtn">▶ শুরু</button>
            <button class="btn-reset" id="resetBtn" title="রিসেট">↺</button>
        </div>

    </div>

    <script>
        (function() {
            "use strict";

            const speedEl = document.getElementById('speedDisplay');
            const distanceEl = document.getElementById('distanceDisplay');
            const trackBtn = document.getElementById('trackBtn');
            const resetBtn = document.getElementById('resetBtn');
            const statusText = document.getElementById('statusText');
            const mapFrame = document.getElementById('mapFrame');

            // ====== ভেরিয়েবল ======
            let lastLat = null;
            let lastLon = null;
            let totalDistance = 0;
            let watchId = null;
            let isTracking = false;
            let lastSpeed = 0;
            let speedFilter = []; // স্পিড ফিল্টারের জন্য
            const FILTER_SIZE = 5;
            const STORAGE_KEY = 'speedTrackerData';

            // ====== লোকাল স্টোরেজ ======
            function saveData() {
                try {
                    const data = {
                        totalDistance: totalDistance,
                        lastLat: lastLat,
                        lastLon: lastLon,
                        lastSpeed: lastSpeed,
                        timestamp: Date.now()
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch(e) { console.warn('Save failed:', e); }
            }

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    totalDistance = data.totalDistance || 0;
                    lastLat = data.lastLat || null;
                    lastLon = data.lastLon || null;
                    lastSpeed = data.lastSpeed || 0;
                    return true;
                } catch(e) { return false; }
            }

            function clearData() {
                try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
            }

            // ====== ফিল্টার ======
            function getFilteredSpeed(newSpeed) {
                speedFilter.push(newSpeed);
                if (speedFilter.length > FILTER_SIZE) {
                    speedFilter.shift();
                }
                // মিডিয়ান ফিল্টার - আউটলায়ার রিমুভ
                const sorted = [...speedFilter].sort((a, b) => a - b);
                const mid = Math.floor(sorted.length / 2);
                return sorted[mid];
            }

            // ====== দূরত্ব ক্যালকুলেশন ======
            function calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            // ====== ম্যাপ আপডেট ======
            function updateMap(lat, lon) {
                if (!lat || !lon) return;
                // গুগল ম্যাপ এম্বেড URL আপডেট
                const url = `https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d14600!2d${lon}!3d${lat}!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sbd!4v1700000000000`;
                mapFrame.src = url;
            }

            // ====== UI আপডেট ======
            function updateUI(speedKmH, distanceKm) {
                if (speedKmH !== undefined && speedKmH !== null && speedKmH >= 0) {
                    speedEl.innerHTML = `${speedKmH.toFixed(1)} <span class="unit">km/h</span>`;
                } else {
                    speedEl.innerHTML = `0.0 <span class="unit">km/h</span>`;
                }

                if (distanceKm !== undefined && distanceKm !== null && distanceKm >= 0) {
                    distanceEl.innerHTML = `${distanceKm.toFixed(2)} <span class="unit">km</span>`;
                } else {
                    distanceEl.innerHTML = `0.00 <span class="unit">km</span>`;
                }
            }

            // ====== লোকেশন কলব্যাক ======
            function handlePosition(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const speedMps = position.coords.speed;
                const accuracy = position.coords.accuracy;

                // GPS একুরেসি চেক (যদি ৫০ মিটারের বেশি হয় তাহলে ইগনোর)
                if (accuracy > 50) {
                    statusText.textContent = '⚠️ GPS সিগন্যাল দুর্বল';
                    statusText.className = 'status-text error';
                    return;
                }

                // স্পিড ফিল্টার
                let rawSpeed = 0;
                if (speedMps !== null && speedMps >= 0) {
                    rawSpeed = speedMps * 3.6;
                }

                // ফিল্টার প্রয়োগ
                let filteredSpeed = getFilteredSpeed(rawSpeed);
                
                // যদি গতি 0.5 km/h এর কম হয় তাহলে 0 দেখাও (নয়েজ ফিল্টার)
                if (filteredSpeed < 0.5) {
                    filteredSpeed = 0;
                }

                // দূরত্ব হিসাব
                if (lastLat !== null && lastLon !== null) {
                    const dist = calculateDistance(lastLat, lastLon, lat, lon);
                    // শুধু মাত্র যদি গতি > 0.5 km/h হয় তাহলে দূরত্ব যোগ করো
                    if (filteredSpeed > 0.5 && dist > 0.003) {
                        totalDistance += dist;
                    }
                }

                lastLat = lat;
                lastLon = lon;
                lastSpeed = filteredSpeed;

                // ম্যাপ আপডেট
                updateMap(lat, lon);

                // UI আপডেট
                updateUI(filteredSpeed, totalDistance);
                statusText.textContent = `📍 ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                statusText.className = 'status-text active';
                
                saveData();
            }

            function handleError(error) {
                let msg = 'GPS সমস্যা: ';
                switch(error.code) {
                    case error.PERMISSION_DENIED: msg += 'অনুমতি অস্বীকৃত'; break;
                    case error.POSITION_UNAVAILABLE: msg += 'লোকেশন নেই'; break;
                    case error.TIMEOUT: msg += 'টাইম আউট'; break;
                    default: msg += error.message;
                }
                statusText.textContent = '⚠️ ' + msg;
                statusText.className = 'status-text error';
            }

            // ====== ট্র্যাকিং কন্ট্রোল ======
            function startTracking() {
                if (!("geolocation" in navigator)) {
                    alert("আপনার ব্রাউজার Geolocation সাপোর্ট করে না।");
                    return;
                }

                if (isTracking) {
                    stopTracking();
                    return;
                }

                watchId = navigator.geolocation.watchPosition(
                    handlePosition,
                    handleError,
                    {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 10000
                    }
                );

                isTracking = true;
                trackBtn.textContent = '⏹ থামান';
                trackBtn.className = 'btn-track stop';
                statusText.textContent = '📡 লোকেশন সংগ্রহ...';
                statusText.className = 'status-text';
            }

            function stopTracking() {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                isTracking = false;
                trackBtn.textContent = '▶ শুরু';
                trackBtn.className = 'btn-track';
                statusText.textContent = '⏸ ট্র্যাকিং বন্ধ';
                statusText.className = 'status-text';
                saveData();
            }

            // ====== রিসেট ======
            function resetAll() {
                if (isTracking) stopTracking();
                
                totalDistance = 0;
                lastLat = null;
                lastLon = null;
                lastSpeed = 0;
                speedFilter = [];
                
                updateUI(0, 0);
                statusText.textContent = '🔄 রিসেট করা হয়েছে';
                statusText.className = 'status-text';
                clearData();
                
                // ম্যাপ রিসেট (ঢাকার সেন্টার)
                mapFrame.src = 'https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d14600!2d90.3563!3d23.7772!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sbd!4v1700000000000';
                
                setTimeout(() => {
                    if (!isTracking) {
                        statusText.textContent = '🛰️ শুরু করতে বাটনে ক্লিক করুন';
                        statusText.className = 'status-text';
                    }
                }, 2000);
            }

            // ====== রিস্টোর ======
            function restoreData() {
                if (loadData()) {
                    updateUI(lastSpeed, totalDistance);
                    if (totalDistance > 0 || lastSpeed > 0) {
                        statusText.textContent = '💾 আগের ডাটা রিস্টোর';
                        statusText.className = 'status-text';
                        if (lastLat && lastLon) {
                            updateMap(lastLat, lastLon);
                        }
                        setTimeout(() => {
                            if (!isTracking) {
                                statusText.textContent = '🛰️ শুরু করতে বাটনে ক্লিক করুন';
                                statusText.className = 'status-text';
                            }
                        }, 2500);
                    }
                }
            }

            // ====== ইভেন্ট ======
            trackBtn.addEventListener('click', startTracking);
            resetBtn.addEventListener('click', resetAll);

            window.addEventListener('beforeunload', function() {
                if (isTracking) saveData();
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            });

            // ====== শুরু ======
            restoreData();
            if (!isTracking) {
                updateUI(0, 0);
            }

        })();
    </script>
</body>
</html>
